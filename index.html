        // ===== New analysis modules: helpers =====
        function collectAllStores(src) {
            const all = [];
            _storeIndex = {};
            Object.entries(src.cities || {}).forEach(([cityName, c]) => {
                Object.entries(c.districts || {}).forEach(([distName, d]) => {
                    (d.stores || []).forEach(s => {
                        // Merge static metadata back in (daily data is normalized:
                        // per-day stores only carry {id, metrics, channels}; the
                        // static fields live once in store_meta keyed by id).
                        const meta = getStoreMeta(s.id);
                        if (meta) {
                            for (const k in meta) {
                                if (!(k in s)) s[k] = meta[k];
                            }
                        }
                        all.push(s);
                        _storeIndex[s.id] = { city: cityName, district: distName };
                    });
                });
            });
            return all;
        }

        // Resolve static store metadata by id. Daily data keeps metadata in a
        // top-level store_meta map (avoids repeating it every day); monthly
        // data already embeds metadata inline, so this is a no-op there.
        function getStoreMeta(id) {
            if (DAILY && DAILY.store_meta && DAILY.store_meta[id]) return DAILY.store_meta[id];
            if (DATA && DATA.store_meta && DATA.store_meta[id]) return DATA.store_meta[id];
            return null;
        }

        // Merge static metadata into a store object in place and return it.
        // Used by the store-detail views that fetch a store directly (bypassing
        // collectAllStores) so daily-mode detail still shows name/agent/etc.
        function hydrateStore(s) {
            const meta = getStoreMeta(s.id);
            if (meta) {
                for (const k in meta) {
                    if (!(k in s)) s[k] = meta[k];
                }
            }
            return s;
        }

        function drillToStoreById(storeId) {
            const info = _storeIndex[storeId];
            if (!info) return;
            currentPath = { city: info.city, district: info.district, storeId: storeId };
            currentLevel = 3;
            renderAll();
        }

        // ----- Module 1: channel quality (surface GMV vs real verified GTV) -----
        // 【已下线 2026-09-17】「📈 转化分析」主题组已删除（用户要求），对应容器 #channelQualityBody 不存在，
        // 此函数保留备用（调用已移除），如需恢复请连同主题组 HTML 一起加回。
        function renderChannelQualityPanel(stores) {
            const el = document.getElementById('channelQualityBody');
            if (!el) return;
            const q = {};
            stores.forEach(s => {
                Object.entries(s.channels || {}).forEach(([name, m]) => {
                    if (!q[name]) q[name] = { gmv: 0, gtv: 0, visitors: 0, conversions: 0, verified: 0, refundW: 0 };
                    const c = q[name];
                    c.gmv += m.gmv || 0;
                    c.gtv += m.gtv || 0;
                    c.visitors += m.visitors || 0;
                    c.conversions += m.conversions || 0;
                    c.verified += m.verified || 0;
                    c.refundW += (m.gmv || 0) * (m.refund_rate || 0);
                });
            });
            const rows = Object.entries(q).sort((a, b) => b[1].gmv - a[1].gmv);
            if (rows.length === 0) { el.innerHTML = '<div class="chart-hint">无渠道数据</div>'; return; }

            let verdicts = [];
            rows.forEach(([name, c]) => {
                c.verify_rate = c.gmv > 0 ? c.gtv / c.gmv * 100 : 0;
                c.refund_rate = c.gmv > 0 ? c.refundW / c.gmv : 0;
                c.conversion_rate = c.visitors > 0 ? c.conversions / c.visitors * 100 : 0;
                const v = [];
                if (c.verify_rate < 60) v.push('<span class="alert-tag alert-high">核销率低</span>');
                if (c.refund_rate > 35) v.push('<span class="alert-tag alert-high">退款率高</span>');
                if (c.verify_rate >= 75 && c.refund_rate < 20) v.push('<span class="alert-tag alert-ok">质量健康</span>');
                verdicts.push(v.join('') || '<span class="alert-tag alert-mid">需关注</span>');
            });

            el.innerHTML = `
                <table>
                    <thead><tr><th>渠道</th><th>GMV（表面成交）</th><th>核销GTV（真实到店）</th><th>核销率</th><th>加权退款率</th><th>转化率</th><th>质量判断</th></tr></thead>
                    <tbody>
                        ${rows.map(([name, c], i) => `
                            <tr style="cursor:default">
                                <td style="font-weight:600"><span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:${CHANNEL_COLORS[name] || '#6b7280'};margin-right:6px;vertical-align:-1px"></span>${esc(name)}</td>
                                <td style="font-weight:600">${fmtMoney(c.gmv)}</td>
                                <td>${fmtMoney(c.gtv)}</td>
                                <td>
                                    <div style="display:flex;align-items:center;gap:8px">
                                        <span style="min-width:48px;font-weight:${c.verify_rate < 60 ? 700 : 500};color:${c.verify_rate < 60 ? '#dc2626' : c.verify_rate >= 75 ? '#059669' : '#374151'}">${fmtPct(c.verify_rate)}</span>
                                        <div class="quality-bar" style="flex:1"><span style="width:${Math.min(c.verify_rate, 100)}%;background:${c.verify_rate < 60 ? '#ef4444' : c.verify_rate >= 75 ? '#10b981' : '#f59e0b'}"></span></div>
                                    </div>
                                </td>
                                <td>
                                    <div style="display:flex;align-items:center;gap:8px">
                                        <span style="min-width:48px;font-weight:${c.refund_rate > 35 ? 700 : 500};color:${c.refund_rate > 35 ? '#dc2626' : '#374151'}">${fmtPct(c.refund_rate)}</span>
                                        <div class="quality-bar" style="flex:1"><span style="width:${Math.min(c.refund_rate, 100)}%;background:${c.refund_rate > 35 ? '#ef4444' : c.refund_rate > 20 ? '#f59e0b' : '#10b981'}"></span></div>
                                    </div>
                                </td>
                                <td>${fmtPct(c.conversion_rate)}</td>
                                <td>${verdicts[i]}</td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
                <div class="chart-hint" style="text-align:left">💡 GMV 是下单口径，核销GTV 才是真实到店消费。核销率 = 核销GTV / GMV；退款率按 GMV 加权。</div>
            `;
        }

        // ----- Module 2: store alert panel -----
        // ----- Module 12: configurable alert thresholds -----
        function toggleAlertSettings() {
            const el = document.getElementById('alertSettingsBody');
            if (!el) return;
            const hidden = el.style.display === 'none';
            el.style.display = hidden ? '' : 'none';
            if (hidden) renderAlertSettings();
        }
        function renderAlertSettings() {
            const el = document.getElementById('alertSettingsBody');
            if (!el) return;
            const t = ALERT_THRESHOLDS;
            const row = (key, label, unit) => `
                <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">
                    <span style="min-width:130px;font-size:13px;color:#374151">${label}</span>
                    <input type="number" id="thr_${key}" value="${t[key]}" step="1" style="width:80px;padding:4px 8px;border:1px solid #e0e3eb;border-radius:6px;font-size:13px">
                    <span style="font-size:12px;color:#9ca3af">${unit}</span>
                </div>`;
            el.innerHTML = `
                <div style="background:#f9fafb;border:1px solid #eef0f4;border-radius:10px;padding:14px">
                    <div style="font-weight:600;margin-bottom:10px;color:#374151;font-size:13px">调整预警触发阈值（即时生效，自动保存）</div>
                    ${row('refundMax', '退款率高于', '%')}
                    ${row('verifyMin', '核销率低于', '%')}
                    ${row('momDropMin', 'GMV环比低于', '%')}
                    ${row('queueUsersMin', '取号人数超过', '人')}
                    ${row('queueCancelMin', '取号取消率超过', '%')}
                    ${row('saturationMax', '工位饱和率超过', '%')}
                    <div style="display:flex;gap:8px;margin-top:10px">
                        <button class="mode-btn" style="background:#4f46e5;color:#fff;border:1px solid #4f46e5;font-size:12px;padding:4px 12px" onclick="applyAlertThresholds()">应用</button>
                        <button class="mode-btn" style="background:#fff;color:#6b7280;border:1px solid #e0e3eb;font-size:12px;padding:4px 12px" onclick="resetAlertThresholds()">恢复默认</button>
                    </div>
                </div>`;
        }
        function applyAlertThresholds() {
            const t = {};
            ['refundMax','verifyMin','momDropMin','queueUsersMin','queueCancelMin','saturationMax'].forEach(k => {
                const inp = document.getElementById('thr_' + k);
                if (inp) t[k] = parseFloat(inp.value);
            });
            ALERT_THRESHOLDS = Object.assign({}, DEFAULT_ALERT_THRESHOLDS, t);
            ALERT_RULES = buildAlertRules(ALERT_THRESHOLDS);
            try { localStorage.setItem('alertThresholds', JSON.stringify(ALERT_THRESHOLDS)); } catch (e) {}
            renderAll();
        }
        function resetAlertThresholds() {
            ALERT_THRESHOLDS = Object.assign({}, DEFAULT_ALERT_THRESHOLDS);
            ALERT_RULES = buildAlertRules(ALERT_THRESHOLDS);
            try { localStorage.setItem('alertThresholds', JSON.stringify(ALERT_THRESHOLDS)); } catch (e) {}
            renderAll();
        }

        // ===== Post-handling follow-up (mark -> verify recovery) =====
        function loadHandledAlerts() {
            try {
                const raw = localStorage.getItem('handledAlerts');
                if (raw) return JSON.parse(raw);
            } catch (e) {}
            return {};
        }
        function persistHandledAlerts() {
            try { localStorage.setItem('handledAlerts', JSON.stringify(_handledAlerts)); } catch (e) {}
        }
        function toggleHandled(storeId) {
            if (_handledAlerts[storeId]) {
                delete _handledAlerts[storeId];
            } else {
                const meta = getStoreMeta(storeId) || {};
                _handledAlerts[storeId] = { ts: Date.now(), date: DAILY && DAILY.latest_date ? DAILY.latest_date : (DATA.month || ''), name: meta.name || storeId };
            }
            persistHandledAlerts();
            renderAll();
        }

        // ===== L3 theme accordion =====
        // toggleTheme uses a CSS class (.open) so the toggle does not collide
        // with the .theme-body { display: none } baseline rule. Inline style
        // strings are unreliable here because empty string lets the CSS rule
        // win again.
        function toggleTheme(themeId) {
            const body = document.getElementById(themeId);
            const caret = document.getElementById(themeId + '_caret');
            if (!body) return;
            const isOpen = body.classList.toggle('open');
            if (caret) caret.textContent = isOpen ? '▾' : '▸';
        }

        function scanStoreAlerts(stores) {
            const alerts = [];
            stores.forEach(s => {
                const m = s.metrics;
                const hits = ALERT_RULES.filter(r => r.test(m));
                if (hits.length > 0) {
                    alerts.push({ store: s, hits, sev: hits.filter(h => h.cls === 'alert-high').length * 2 + hits.length });
                }
            });
            alerts.sort((a, b) => b.sev - a.sev);
            return alerts;
        }

        function renderAlertPanel(stores) {
            const el = document.getElementById('alertPanelBody');
            if (!el) return;
            const alerts = scanStoreAlerts(stores);
            if (stores.length === 0) {
                el.innerHTML = '<div class="summary-chip alert-ok" style="display:inline-block">✅ 无门店数据</div>';
                return;
            }
            // 健康门店（未触发预警）作为「红榜」，按 GMV 降序展示。
            const alertIds = {};
            alerts.forEach(a => { alertIds[a.store.id] = true; });
            const healthy = stores.filter(s => !alertIds[s.id]).sort((a, b) => (b.metrics.gmv || 0) - (a.metrics.gmv || 0));

            const counts = {};
            ALERT_RULES.forEach(r => { counts[r.key] = alerts.filter(a => a.hits.some(h => h.key === r.key)).length; });

            // Severity tiers
            const tiers = { red: [], ora: [], yel: [] };
            alerts.forEach(a => { const t = severityTier(a); tiers[t].push(a); });
            // Within each tier keep the existing severity sort.
            ['red', 'ora', 'yel'].forEach(t => tiers[t].sort((a, b) => b.sev - a.sev));

            // 全部显示：黑榜（预警门店，按严重度降序）在前，红榜（健康门店）在后。
            const flat = [...tiers.red, ...tiers.ora, ...tiers.yel];

            // Per-agent aggregation (responsibility attribution)
            const agentMap = {};
            alerts.forEach(a => {
                const ag = (a.store.agent || '未分配').trim();
                agentMap[ag] = (agentMap[ag] || 0) + 1;
            });
            const agentList = Object.entries(agentMap).sort((a, b) => b[1] - a[1]);

            const row = (a, i) => {
                const meta = SEV_META[severityTier(a)];
                const actions = actionForStore(a.hits);
                const agent = (a.store.agent || '未分配').trim();
                const handled = !!_handledAlerts[a.store.id];
                return `
                    <tr onclick="drillToStoreById('${jsStr(a.store.id)}')" style="${handled ? 'opacity:0.55' : ''}">
                        <td><span class="rank-badge rank-other">${i+1}</span></td>
                        <td><span class="alert-sev ${meta.cls}">${meta.label}</span></td>
                        <td style="font-weight:600">${esc(shortStoreName(a.store.name))}</td>
                        <td>${esc(a.store.city || '')}</td>
                        <td>${esc(a.store.district || '')}</td>
                        <td><span class="alert-agent">${esc(agent)}</span></td>
                        <td>${a.hits.map(h => '<span class="alert-tag ' + h.cls + '" title="' + h.detail(a.store.metrics) + '">' + h.tag + '</span>').join('')}<div class="alert-action">💡 ${esc(actions[0] || '')}</div></td>
                        <td>${fmtMoney(a.store.metrics.gmv)}</td>
                        <td style="color:${a.store.metrics.refund_rate > 40 ? '#dc2626' : '#374151'};font-weight:${a.store.metrics.refund_rate > 40 ? 600 : 400}">${fmtPct(a.store.metrics.refund_rate)}</td>
                        <td style="color:${a.store.metrics.verify_rate < 50 ? '#dc2626' : '#374151'}">${fmtPct(a.store.metrics.verify_rate)}</td>
                        <td style="color:${a.store.metrics.gmv_mom < 0 ? '#ef4444' : '#10b981'}">${fmtPctSigned(a.store.metrics.gmv_mom)}</td>
                        <td><button class="mode-btn" style="background:${handled ? '#d1fae5' : '#f0f2f5'};color:${handled ? '#059669' : '#6b7280'};border:1px solid ${handled ? '#a7f3d0' : '#e0e3eb'};font-size:11px;padding:2px 8px" onclick="event.stopPropagation();toggleHandled('${jsStr(a.store.id)}')">${handled ? '已处理✓' : '标记处理'}</button></td>
                    </tr>`;
            };

            const healthyRow = (s, i) => {
                const agent = (s.agent || '未分配').trim();
                return `
                    <tr onclick="drillToStoreById('${jsStr(s.id)}')">
                        <td><span class="rank-badge rank-other">${i+1}</span></td>
                        <td><span class="alert-sev alert-ok">健康</span></td>
                        <td style="font-weight:600">${esc(shortStoreName(s.name))}</td>
                        <td>${esc(s.city || '')}</td>
                        <td>${esc(s.district || '')}</td>
                        <td><span class="alert-agent">${esc(agent)}</span></td>
                        <td><span class="alert-tag alert-ok">指标正常</span><div class="alert-action">💡 保持当前运营</div></td>
                        <td>${fmtMoney(s.metrics.gmv)}</td>
                        <td style="color:#374151">${fmtPct(s.metrics.refund_rate)}</td>
                        <td style="color:#374151">${fmtPct(s.metrics.verify_rate)}</td>
                        <td style="color:${s.metrics.gmv_mom < 0 ? '#ef4444' : '#10b981'}">${fmtPctSigned(s.metrics.gmv_mom)}</td>
                        <td><span style="color:#9ca3af;font-size:11px">—</span></td>
                    </tr>`;
            };

            const tierChip = (t, arr) => {
                const meta = SEV_META[t];
                return arr.length > 0 ? `<span class="alert-sev ${meta.cls}">${meta.label} ${arr.length} 家</span>` : '';
            };

            el.innerHTML = `
                <div class="summary-chips">
                    <div class="summary-chip danger">触发预警门店<b>${alerts.length} / ${stores.length}</b></div>
                    ${tierChip('red', tiers.red)}${tierChip('ora', tiers.ora)}${tierChip('yel', tiers.yel)}
                    <div class="summary-chip good">健康门店<b>${healthy.length}家</b></div>
                    <div class="summary-chip">退款率&gt;${ALERT_THRESHOLDS.refundMax}%<b>${counts.refund}家</b></div>
                    <div class="summary-chip">核销率&lt;${ALERT_THRESHOLDS.verifyMin}%<b>${counts.verify}家</b></div>
                    <div class="summary-chip">GMV环比跌&lt;${ALERT_THRESHOLDS.momDropMin}%<b>${counts.momDrop}家</b></div>
                    <div class="summary-chip ${counts.queue > 0 ? 'warn' : ''}">排队流失<b>${counts.queue}家</b></div>
                    <div class="summary-chip ${counts.capacity > 0 ? 'warn' : ''}">产能瓶颈<b>${counts.capacity}家</b></div>
                </div>
                ${agentList.length > 0 ? `<div class="chart-hint" style="text-align:left;margin-bottom:8px">👤 责任分布：${agentList.slice(0, 5).map(([ag, n]) => '<span class="alert-agent" style="margin-right:6px">' + esc(ag) + ' · ' + n + ' 家</span>').join('')}${agentList.length > 5 ? '<span class="alert-agent">…</span>' : ''}</div>` : ''}
                <table>
                    <thead><tr><th>#</th><th>级别</th><th>门店</th><th>城市</th><th>区域</th><th>责任人</th><th>触发原因 &amp; 建议动作</th><th>GMV</th><th>退款率</th><th>核销率</th><th>GMV环比</th><th>处理</th></tr></thead>
                    <tbody>${flat.map(row).join('')}${healthy.map((s, i) => healthyRow(s, flat.length + i)).join('')}</tbody>
                </table>
                <div class="chart-hint">👆 点击行进入门店详情 · 上方为预警门店（黑榜，按严重度降序），下方为健康门店（红榜，按 GMV 降序），共 ${stores.length} 家全部展示</div>
            `;
        }

        // ----- Module 3b: 门店产能结构表 -----
        // 逐店列出产能画像（美甲师数、日均服务人数、饱和率、人效）并给出产能状态判断。
        function renderCapacityTable(stores) {
            const el = document.getElementById('capacityTableBody');
            if (!el) return;
            const valid = stores.filter(s => (s.metrics.efficiency || 0) > 0);
            if (valid.length === 0) { el.innerHTML = '<div class="chart-hint">无数据</div>'; return; }
            const avgSat = valid.reduce((a, s) => a + (s.metrics.saturation || 0), 0) / valid.length;
            const avgEff = valid.reduce((a, s) => a + (s.metrics.efficiency || 0), 0) / valid.length;

            const classify = s => {
                const m = s.metrics;
                const sat = m.saturation || 0, eff = m.efficiency || 0;
                const lowSat = sat < avgSat;
                const highCancel = (m.cancel_queue_rate || 0) >= 30;
                const lowCancel = (m.cancel_queue_rate || 0) < 15;
                const lowEff = eff < avgEff;
                const tags = [];
                if (lowSat && highCancel) tags.push('人手不足');
                if (lowCancel && lowEff) tags.push('人手冗余');
                let label, cls, tip;
                if (sat >= avgSat && eff >= avgEff) { label = '满编高效'; cls = 'alert-high'; tip = '扩台/扩店'; }
                else if (sat >= avgSat && lowEff)   { label = '满编低效'; cls = 'alert-mid'; tip = '优化排班/提技能'; }
                else if (lowSat && lowEff)          { label = '缺编低效'; cls = 'alert-mid'; tip = '招人+引流'; }
                else                                { label = '缺编高效'; cls = 'alert-ok'; tip = '招美甲师'; }
                return { label, cls, tip, tags };
            };
            const order = { '满编高效': 0, '满编低效': 1, '缺编低效': 2, '缺编高效': 3 };
            const rows = valid.map(s => ({ s, c: classify(s) }))
                .sort((a, b) => (order[a.c.label] - order[b.c.label]) || ((b.s.metrics.saturation || 0) - (a.s.metrics.saturation || 0)));

            el.innerHTML = `
                <div class="summary-chips">
                    <div class="summary-chip">门店总数<b>${valid.length}家</b></div>
                    <div class="summary-chip">平均饱和率<b>${fmtPct(avgSat)}</b></div>
                    <div class="summary-chip">平均人效<b>¥${Math.round(avgEff)}/日</b></div>
                    <div class="summary-chip warn">满编高效（该扩店）<b>${valid.filter(s => classify(s).label === '满编高效').length}家</b></div>
                    <div class="summary-chip danger">疑似人手不足<b>${valid.filter(s => classify(s).tags.includes('人手不足')).length}家</b></div>
                    <div class="summary-chip">疑似人手冗余<b>${valid.filter(s => classify(s).tags.includes('人手冗余')).length}家</b></div>
                </div>
                <table>
                    <thead><tr><th>门店</th><th>城市</th><th>美甲师</th><th>工位饱和率</th><th>人效</th><th>取号取消率</th><th>产能状态</th><th>建议</th></tr></thead>
                    <tbody>
                        ${rows.map(({ s, c }) => {
                            const m = s.metrics;
                            return `<tr onclick="drillToStoreById('${jsStr(s.id)}')">
                                <td style="font-weight:600">${esc(shortStoreName(s.name))}</td>
                                <td>${esc(s.city || '')}</td>
                                <td>${m.manicurist_count || 0}</td>
                                <td>
                                    <div style="display:flex;align-items:center;gap:8px">
                                        <span style="min-width:46px;font-weight:${m.saturation >= 100 ? 700 : 500};color:${m.saturation >= 100 ? '#dc2626' : m.saturation >= avgSat ? '#d97706' : '#374151'}">${fmtPct(m.saturation)}</span>
                                        <div class="quality-bar" style="flex:1"><span style="width:${Math.min(m.saturation, 100)}%;background:${m.saturation >= 100 ? '#ef4444' : m.saturation >= avgSat ? '#f59e0b' : '#10b981'}"></span></div>
                                    </div>
                                </td>
                                <td>¥${Math.round(m.efficiency || 0)}</td>
                                <td style="font-weight:${m.cancel_queue_rate >= 30 ? 700 : 400};color:${m.cancel_queue_rate >= 30 ? '#dc2626' : '#374151'}">${fmtPct(m.cancel_queue_rate)}</td>
                                <td><span class="alert-tag ${c.cls}">${c.label}</span>${c.tags.map(t => '<span class="alert-tag ' + (t === '人手不足' ? 'alert-high' : 'alert-mid') + '">' + t + '</span>').join('')}</td>
                                <td style="font-size:12px;color:#6b7280">${c.tip}</td>
                            </tr>`;
                        }).join('')}
                    </tbody>
                </table>
                <div class="chart-hint" style="text-align:left">💡 工位饱和率 = 美甲师数 ÷ 工位数（人力配置，&lt;100%=有空工位即缺人，≥100%=满编/超配）。产能状态按「饱和率 × 人效」相对连锁均值（饱和率 ${fmtPct(avgSat)}、人效 ¥${Math.round(avgEff)}）划分；「人手不足」=缺编+取号取消率≥30%，「人手冗余」=取消率&lt;15%+人效&lt;均值。</div>
            `;
        }

        // ----- Module 6: review/reputation monitoring (bad reviews + low good-rate) -----
        function renderReviewPanel(stores) {
            const el = document.getElementById('reviewPanelBody');
            if (!el) return;

            // 好评率/差评率口径（按用户要求）：好评率 = 好评数 ÷ 总核销单数；差评率 = 差评数 ÷ 总核销单数。
            // 核销单数 = verified 字段（核销人数/单数）。
            const goodRate = s => {
                const ver = s.metrics.verified || 0;
                const good = s.metrics.good_reviews || 0;
                return ver > 0 ? good / ver * 100 : 0;
            };
            const badRate = s => {
                const ver = s.metrics.verified || 0;
                const bad = s.metrics.bad_reviews || 0;
                return ver > 0 ? bad / ver * 100 : 0;
            };

            // Bad-review ranking: stores with at least one bad review, ranked by bad rate (差评率).
            const hasBad = stores.filter(s => (s.metrics.bad_reviews || 0) > 0);
            const badTop = [...hasBad].sort((a, b) => badRate(b) - badRate(a)).slice(0, 10);

            // Low good-rate ranking: ranked by good rate (好评率).
            const hasVerified = stores.filter(s => (s.metrics.verified || 0) > 0);
            const lowRate = [...hasVerified].sort((a, b) => goodRate(a) - goodRate(b)).slice(0, 10);

            // Summary stats
            const totalBad = stores.reduce((a, s) => a + (s.metrics.bad_reviews || 0), 0);
            const totalGood = stores.reduce((a, s) => a + (s.metrics.good_reviews || 0), 0);
            const totalVerified = stores.reduce((a, s) => a + (s.metrics.verified || 0), 0);
            const overallGoodRate = totalVerified > 0 ? totalGood / totalVerified * 100 : 0;
            const overallBadRate = totalVerified > 0 ? totalBad / totalVerified * 100 : 0;

            const row = (s, key, valueHtml) => `
                <tr onclick="drillToStoreById('${jsStr(s.id)}')">
                    <td style="font-weight:600">${esc(shortStoreName(s.name))}</td>
                    <td>${esc(s.city)}</td>
                    <td>${fmtNum(s.metrics.verified || 0)}</td>
                    <td>${fmtNum(s.metrics.good_reviews || 0)}</td>
                    <td style="font-weight:600;color:#dc2626">${fmtNum(s.metrics.bad_reviews || 0)}</td>
                    <td style="color:${goodRate(s) < 95 ? '#dc2626' : '#374151'}">${fmtPct(goodRate(s))}</td>
                    <td style="color:${badRate(s) > 5 ? '#dc2626' : '#374151'}">${fmtPct(badRate(s))}</td>
                </tr>`;

            el.innerHTML = `
                <div class="summary-chips">
                    <div class="summary-chip">总核销单数<b>${fmtNum(totalVerified)}</b></div>
                    <div class="summary-chip good">累计好评<b>${fmtNum(totalGood)}</b></div>
                    <div class="summary-chip danger">累计差评<b>${fmtNum(totalBad)}</b></div>
                    <div class="summary-chip ${overallGoodRate >= 98 ? 'good' : 'warn'}">整体好评率<b>${fmtPct(overallGoodRate)}</b></div>
                    <div class="summary-chip ${overallBadRate > 5 ? 'danger' : 'good'}">整体差评率<b>${fmtPct(overallBadRate)}</b></div>
                </div>
                <div class="funnel-wrap" style="grid-template-columns:1fr 1fr">
                    <div>
                        <div class="sc-head">🔴 差评率 Top ${badTop.length}</div>
                        ${badTop.length === 0 ? '<div class="chart-hint">暂无差评门店 👍</div>' : `
                        <table>
                            <thead><tr><th>门店</th><th>城市</th><th>核销单数</th><th>好评</th><th>差评</th><th>好评率</th><th>差评率</th></tr></thead>
                            <tbody>${badTop.map(s => row(s)).join('')}</tbody>
                        </table>`}
                    </div>
                    <div>
                        <div class="sc-head">🟡 好评率垫底 ${lowRate.length}</div>
                        ${lowRate.length === 0 ? '<div class="chart-hint">暂无评价数据</div>' : `
                        <table>
                            <thead><tr><th>门店</th><th>城市</th><th>核销单数</th><th>好评</th><th>差评</th><th>好评率</th><th>差评率</th></tr></thead>
                            <tbody>${lowRate.map(s => row(s)).join('')}</tbody>
                        </table>`}
                    </div>
                </div>
                <div class="chart-hint">👆 点击行进入门店详情 · 好评率 = 好评数 ÷ 总核销单数 · 差评率 = 差评数 ÷ 总核销单数 · 差评会直接影响平台流量权重，建议优先跟进</div>
            `;
        }

        // ----- Module: 拒客嫌疑（RejectPanel）-----
        // 数据来自 reject_rank.json（reject_model.py）。只展示「不可刷」证据：
        // 平台官方问题订单 / 咨询响应 / 取消率 / 核销率 / 退款率 / 取号率。
        // 星级、经营分、评分一律不参与（用户 2026-09-17 明确要求）。
        function rejectTierMeta(tier) {
            if (tier === 'high') return { label: '🔴 高危', cls: 'rj-tier-high' };
            if (tier === 'mid') return { label: '🟠 疑似', cls: 'rj-tier-mid' };
            return { label: '🟡 关注', cls: 'rj-tier-low' };
        }

        function renderRejectPanel(stores) {
            const el = document.getElementById('rejectPanelBody');
            if (!el) return;

            const RJ = window.REJECT_RANK;
            if (!RJ || !RJ.stores) {
                el.innerHTML = '<div class="chart-hint" style="text-align:left">暂无拒客评分数据（reject_rank.json 未生成）。'
                    + '请先运行 <b>reject_model.py</b> 并重建看板。</div>';
                return;
            }

            // 只保留当前层级可见门店（城市页=该城市；全国页=全部）
            const ids = new Set((stores || []).map(s => String(s.id)));
            const rows = Object.values(RJ.stores)
                .filter(r => ids.size === 0 || ids.has(String(r.id)))
                .filter(r => r.tier && r.tier !== 'none')
                .sort((a, b) => b.score - a.score);

            const high = rows.filter(r => r.tier === 'high');
            const mid = rows.filter(r => r.tier === 'mid');
            const low = rows.filter(r => r.tier === 'low');
            const base = RJ.baseline || {};

            const chips = `
                <div class="summary-chips">
                    <div class="summary-chip danger">高危 ≥${RJ.thresholds ? RJ.thresholds.high : 8}<b>${high.length} 家</b></div>
                    <div class="summary-chip warn">疑似<b>${mid.length} 家</b></div>
                    <div class="summary-chip">关注<b>${low.length} 家</b></div>
                    <div class="summary-chip danger">⭐ 官方拒客记录<b>${rows.filter(r => r.ev.some(e => e.t.indexOf('官方拒客单') >= 0)).length} 家</b></div>
                    <div class="summary-chip">真忙已豁免<b>${rows.filter(r => r.busy).length} 家</b></div>
                </div>`;

            if (rows.length === 0) {
                el.innerHTML = chips + '<div class="chart-hint" style="text-align:left">'
                    + '<span style="color:#059669">本层级未发现拒客嫌疑门店。</span>'
                    + '（仅代表当月线上可观测数据无异常）</div>' + rejectBaselineFoot(RJ);
                return;
            }

            const rowHTML = (r, i) => {
                const meta = rejectTierMeta(r.tier);
                const ev = (r.ev || []).map(e =>
                    `<span class="rj-ev"><span class="rj-w">+${e.w}</span>${esc(e.t)}</span>`).join('');
                return `<tr onclick="drillToStoreById('${jsStr(r.id)}')" style="cursor:pointer">
                    <td style="color:#8895a7">${i + 1}</td>
                    <td style="font-weight:600">${esc(shortStoreName(r.name || ''))}</td>
                    <td>${esc(r.city || '')}</td>
                    <td>${esc(r.district || '')}</td>
                    <td><span class="rj-score" style="color:${r.tier === 'high' ? '#dc2626' : r.tier === 'mid' ? '#d97706' : '#4f46e5'}">${r.score.toFixed(1)}</span></td>
                    <td><span class="rj-tier ${meta.cls}">${meta.label}</span>${r.busy ? ' <span class="rj-busy">真忙</span>' : ''}</td>
                    <td style="max-width:560px;white-space:normal">${ev}</td>
                </tr>`;
            };

            const tableHead = `<table>
                <thead><tr><th>#</th><th>门店</th><th>城市</th><th>区域</th><th>嫌疑分</th><th>分层</th><th>证据（权重 · 明细）</th></tr></thead>
                <tbody>`;

            let html = chips;
            if (high.length) html += `<div class="alert-sec-head" style="font-weight:600;font-size:12px;color:#dc2626;margin:6px 0 4px">🔴 高危（≥${RJ.thresholds ? RJ.thresholds.high : 8} 分）— 48h 内回访核对</div>`
                + tableHead + high.map(rowHTML).join('') + '</tbody></table>';
            if (mid.length) html += `<div class="alert-sec-head" style="font-weight:600;font-size:12px;color:#d97706;margin:14px 0 4px">🟠 疑似 — 区域经理核查</div>`
                + tableHead + mid.map(rowHTML).join('') + '</tbody></table>';
            if (low.length) html += `<details class="rj-fold"><summary>🟡 关注 ${low.length} 家（点击展开，轻微偏离，下月复看）</summary>`
                + tableHead + low.map(rowHTML).join('') + '</tbody></table></details>';

            html += rejectBaselineFoot(RJ);
            el.innerHTML = html;
        }

        // 面板底部：当月动态基准 + 豁免规则说明 + 数据月份
        function rejectBaselineFoot(RJ) {
            const b = RJ.baseline || {};
            const t = RJ.thresholds || {};
            return `<div class="rj-foot">
                <div>📐 <b>当月动态基准</b>（全连锁中位数，每月重算，跨月不比分数只比名单）：
                    取消率 ${(b.cancel || 0).toFixed(1)}% ·
                    抖音核销 ${(b.dy_verify || 0).toFixed(1)}% ·
                    美团核销 ${(b.mt_verify || 0).toFixed(1)}% ·
                    退款率 ${(b.refund || 0).toFixed(1)}% ·
                    咨询响应 ${(b.resp || 0).toFixed(0)}s ·
                    取号率 ${(b.queue_rate || 0).toFixed(2)}% ·
                    等待 ${(b.wait || 0).toFixed(0)}min</div>
                <div>🛡️ <b>真忙豁免</b>：工位饱和率 ≥${t.busy_saturation || 85}% 或 平均等待 ≥${t.busy_wait_min || 110}min 的门店，取消率类证据不计分（产能不足 ≠ 拒客，归入「⚙️ 产能分析」）。</div>
                <div>🧮 <b>口径</b>：只用不可刷证据（平台官方问题订单 / 咨询响应 / 取消率 / 核销率 / 退款率 / 取号率）。
                    <b>星级、经营分、评分、好评率不参与</b>（可人工刷高）。
                    数据期 ${esc(RJ.month || '—')} · 生成于 ${esc(RJ.generated_at || '—')} · 规则见「拒客模型规格.md」</div>
            </div>`;
        }

        // ----- Module: 流量分析（访问侧）-----
        // 城市/区口径：门店访问量排行 + 渠道访问构成。门店侧另有 renderStoreTrafficPanel。
        function renderTrafficPanel(stores) {
            const rankEl = document.getElementById('trafficRankBody');
            const chEl = document.getElementById('trafficChannelBody');
            if (!rankEl && !chEl) return;

            // 门店访问量排行（按访问量降序）
            if (rankEl) {
                const list = [...stores].sort((a, b) => (b.metrics.visitors || 0) - (a.metrics.visitors || 0));
                if (list.length === 0) {
                    rankEl.innerHTML = '<div class="chart-hint">无门店数据</div>';
                } else {
                    const totalVis = stores.reduce((a, s) => a + (s.metrics.visitors || 0), 0);
                    // 每店渠道访问构成（用于行内小条，小程序访问量剔除）
                    const chSummary = s => {
                        const chs = {};
                        Object.entries(s.channels || {}).forEach(([n, c]) => {
                            if (n !== '小程序') chs[n] = c;
                        });
                        const sum = Object.values(chs).reduce((a, c) => a + (c.visitors || 0), 0);
                        return { chs, sum };
                    };
                    rankEl.innerHTML = `
                        <table>
                            <thead><tr><th>#</th><th>门店</th><th>城市</th><th>区域</th><th>访问量</th><th>访问占比</th><th>访问环比</th><th>渠道构成</th><th>转化率</th></tr></thead>
                            <tbody>
                                ${list.map((s, i) => {
                                    const m = s.metrics || {};
                                    const v = m.visitors || 0;
                                    const mom = m.visitors_mom || 0;
                                    const { chs, sum } = chSummary(s);
                                    const share = totalVis > 0 ? v / totalVis * 100 : 0;
                                    const chSegs = sum > 0
                                        ? Object.entries(chs).map(([name, c]) => {
                                            const p = (c.visitors || 0) / sum * 100;
                                            return `<span title="${esc(name)} ${fmtNum(c.visitors || 0)}（${p.toFixed(1)}%）" style="display:inline-block;background:${CHANNEL_COLORS[name] || '#6b7280'};height:10px;border-radius:2px;width:${p.toFixed(1)}%"></span>`;
                                        }).join('')
                                        : '<span class="chart-hint" style="font-size:11px">—</span>';
                                    return `
                                        <tr onclick="drillToStoreById('${jsStr(s.id)}')" style="cursor:pointer">
                                            <td style="color:#8895a7">${i + 1}</td>
                                            <td style="font-weight:600">${esc(shortStoreName(s.name))}</td>
                                            <td>${esc(s.city || '')}</td>
                                            <td>${esc(s.district || '')}</td>
                                            <td style="font-weight:600;color:#4f46e5">${fmtNum(v)}</td>
                                            <td>${fmtPct(share)}</td>
                                            <td style="color:${mom >= 0 ? '#dc2626' : '#16a34a'};font-weight:600">${fmtPctSigned(mom)}</td>
                                            <td><div style="display:flex;width:140px;height:10px;border-radius:2px;overflow:hidden;gap:1px">${chSegs}</div></td>
                                            <td>${fmtPct(m.conversion_rate)}</td>
                                        </tr>`;
                                }).join('')}
                            </tbody>
                        </table>
                        <div class="chart-hint" style="text-align:left">👆 点击门店进入详情 · 访问占比 = 该店访问量 ÷ 本层级总访问量 · 渠道色：<span style="color:#4f46e5">■</span>抖音 <span style="color:#16a34a">■</span>美团 <span style="color:#d97706">■</span>小程序</div>
                    `;
                }
            }

            // 门店 × 渠道流量矩阵：每行一个门店，每列一个渠道，单元格=访问量+转化率（热度色块），
            // 行尾给出渠道依赖度诊断。
            if (chEl) {
                const TRAFFIC_EXCLUDE = ['小程序']; // 小程序访问量未按门店真实归因（固定值），流量分析中剔除
                const chNames = [];
                stores.forEach(s => {
                    Object.keys(s.channels || {}).forEach(n => { if (!chNames.includes(n) && !TRAFFIC_EXCLUDE.includes(n)) chNames.push(n); });
                });
                // 渠道按总访问量降序排列
                const chTotals = {};
                stores.forEach(s => {
                    Object.entries(s.channels || {}).forEach(([n, c]) => {
                        if (TRAFFIC_EXCLUDE.includes(n)) return;
                        chTotals[n] = (chTotals[n] || 0) + (c.visitors || 0);
                    });
                });
                chNames.sort((a, b) => (chTotals[b] || 0) - (chTotals[a] || 0));

                if (stores.length === 0) {
                    chEl.innerHTML = '<div class="chart-hint">无门店数据</div>';
                } else {
                    // 计算每店每渠道访问量，找出本层级内每渠道的访问量分位（用于热度映射）
                    const maxVis = {}; chNames.forEach(n => { maxVis[n] = 0; });
                    stores.forEach(s => {
                        Object.entries(s.channels || {}).forEach(([n, c]) => {
                            if (TRAFFIC_EXCLUDE.includes(n)) return;
                            if ((c.visitors || 0) > (maxVis[n] || 0)) maxVis[n] = c.visitors || 0;
                        });
                    });

                    // 行内诊断：基于真实分布给每店明确的问题分类（小程序剔除）
                    // 基准：抖音核销率中位 47%、美团核销率中位 87%（全城市实测分布）
                    const diagFor = s => {
                        const chs = {};
                        Object.entries(s.channels || {}).forEach(([n, c]) => {
                            if (!TRAFFIC_EXCLUDE.includes(n)) chs[n] = c;
                        });
                        const dy = chs['抖音'], mt = chs['美团'];
                        const tags = [];
                        // 抖音订单核销率 <45%（约等于中位数47%）= 核销偏低
                        if (dy && (dy.verify_rate || 0) > 0 && (dy.verify_rate || 0) < 45) {
                            tags.push(`<span class="alert-tag alert-high">抖音核销率仅${(dy.verify_rate || 0).toFixed(0)}%</span>`);
                        }
                        // 美团订单核销率 <80%（明显低于中位数87%）= 核销偏低
                        if (mt && (mt.verify_rate || 0) > 0 && (mt.verify_rate || 0) < 80) {
                            tags.push(`<span class="alert-tag alert-high">美团核销率仅${(mt.verify_rate || 0).toFixed(0)}%</span>`);
                        }
                        // 单渠道 GMV 占比 ≥70% = 依赖
                        const totalGmv = Object.values(chs).reduce((a, c) => a + (c.gmv || 0), 0);
                        if (totalGmv > 0) {
                            const byGmv = Object.entries(chs).sort((a, b) => (b[1].gmv || 0) - (a[1].gmv || 0));
                            const topShare = (byGmv[0][1].gmv || 0) / totalGmv * 100;
                            if (topShare >= 70) tags.push(`<span class="alert-tag alert-mid">依赖${esc(byGmv[0][0])} ${topShare.toFixed(0)}%</span>`);
                        }
                        return tags.join('') || '<span class="alert-tag alert-ok">正常</span>';
                    };

                    const cell = (s, n) => {
                        const c = (s.channels || {})[n];
                        if (!c) return '<td style="color:#d1d5db;text-align:center">—</td>';
                        const cv = c.visitors || 0;
                        const conv = cv > 0 ? (c.conversions || 0) / cv * 100 : 0;
                        const vr = c.verify_rate || 0;
                        const mx = maxVis[n] || 1;
                        const alpha = 0.06 + 0.5 * (cv / mx);
                        const col = CHANNEL_COLORS[n] || '#6b7280';
                        return `<td style="text-align:center">
                            <div style="padding:4px 6px;border-radius:6px;background:${hexWithAlpha(col, alpha)}">
                                <div style="font-weight:600;color:#1f2937">${fmtNum(cv)}</div>
                                <div style="font-size:11px;color:${conv < 5 ? '#dc2626' : '#6b7280'}">转${fmtPct(conv)}</div>
                                <div style="font-size:11px;color:${vr > 0 && vr < 40 ? '#dc2626' : '#6b7280'}">核${fmtPct(vr)}</div>
                            </div>
                        </td>`;
                    };

                    // 排序：按总访问量降序
                    const list = [...stores].sort((a, b) => (b.metrics.visitors || 0) - (a.metrics.visitors || 0));

                    chEl.innerHTML = `
                        <table style="font-size:12px">
                            <thead><tr><th>门店</th><th>城市</th>${chNames.map(n => `<th style="text-align:center"><span style="display:inline-block;width:9px;height:9px;border-radius:50%;background:${CHANNEL_COLORS[n] || '#6b7280'};margin-right:4px;vertical-align:-1px"></span>${esc(n)}</th>`).join('')}<th style="min-width:130px">渠道诊断</th></tr></thead>
                            <tbody>
                                ${list.map(s => `
                                    <tr onclick="drillToStoreById('${jsStr(s.id)}')" style="cursor:pointer">
                                        <td style="font-weight:600">${esc(shortStoreName(s.name))}</td>
                                        <td>${esc(s.city || '')}</td>
                                        ${chNames.map(n => cell(s, n)).join('')}
                                        <td>${diagFor(s)}</td>
                                    </tr>`).join('')}
                            </tbody>
                        </table>
                        <div class="chart-hint" style="text-align:left">👆 点击门店进入详情 · 单元格 = 访问量 / 转化率 / 订单核销率（BI口径） · <span class="alert-tag alert-high">X核销率仅Y%</span>=该渠道订单核销率低于阈值（抖音&lt;45% · 美团&lt;80%，约为各渠道中位数） · <span class="alert-tag alert-mid">依赖X%</span>=单渠道GMV贡献≥70% · 小程序访问量已剔除（无论哪个渠道下单最终都去抖音取号）</div>
                    `;
                }
            }
        }

        // 十六进制颜色转带 alpha 的 rgba（用于渠道热度色块）
        function hexWithAlpha(hex, alpha) {
            if (!hex || hex[0] !== '#') return 'rgba(107,114,128,' + alpha + ')';
            let h = hex.slice(1);
            if (h.length === 3) h = h.split('').map(c => c + c).join('');
            const r = parseInt(h.slice(0, 2), 16), g = parseInt(h.slice(2, 4), 16), b = parseInt(h.slice(4, 6), 16);
            return 'rgba(' + r + ',' + g + ',' + b + ',' + alpha + ')';
        }

        // ----- Module 7: weekday pattern analysis (weekend vs weekday, daily-only) -----
        function renderWeekdayPanel() {
            const card = document.getElementById('weekdayPanelCard');
            const el = document.getElementById('weekdayPanelBody');
            const group = document.getElementById('themeRhythmGroup');
            if (!card || !el) return;

            // Weekday analysis only makes sense in daily mode (needs per-date
            // granularity). Hide the entire theme group in monthly mode.
            if (appMode !== 'daily' || !DAILY || !DAILY.dates || DAILY.dates.length === 0) {
                card.style.display = 'none';
                if (group) group.style.display = 'none';
                return;
            }
            card.style.display = '';
            if (group) group.style.display = '';

            const WEEKDAYS = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
            // Aggregate each weekday's totals, then average per occurrence.
            const agg = Array.from({ length: 7 }, () => ({ gmv: 0, gtv: 0, visitors: 0, n: 0 }));
            DAILY.dates.forEach(d => {
                const entry = DAILY.daily[d];
                if (!entry || !entry.total) return;
                const dow = new Date(d + 'T00:00:00').getDay();
                agg[dow].gmv += entry.total.gmv || 0;
                agg[dow].gtv += entry.total.gtv || 0;
                agg[dow].visitors += entry.total.visitors || 0;
                agg[dow].n++;
            });

            const avg = agg.map((a, i) => ({
                label: WEEKDAYS[i],
                gmv: a.n > 0 ? a.gmv / a.n : 0,
                gtv: a.n > 0 ? a.gtv / a.n : 0,
                visitors: a.n > 0 ? a.visitors / a.n : 0,
                n: a.n,
                isWeekend: i === 0 || i === 6,
            }));

            // Weekend vs weekday ratio (weighted by occurrence counts).
            const wk = agg.slice(1, 6).reduce((a, x) => ({ gmv: a.gmv + x.gmv, n: a.n + x.n }), { gmv: 0, n: 0 });
            const we = [agg[0], agg[6]].reduce((a, x) => ({ gmv: a.gmv + x.gmv, n: a.n + x.n }), { gmv: 0, n: 0 });
            const wkAvg = wk.n > 0 ? wk.gmv / wk.n : 0;
            const weAvg = we.n > 0 ? we.gmv / we.n : 0;
            const ratio = wkAvg > 0 ? weAvg / wkAvg : 0;
            const ratioText = ratio > 0 ? (ratio >= 1 ? `周末 GMV 是工作日的 <b>${ratio.toFixed(2)}</b> 倍` : `周末 GMV 仅为工作日的 <b>${(ratio * 100).toFixed(0)}%</b>`) : '数据不足';

            el.innerHTML = `
                <div class="summary-chips">
                    <div class="summary-chip">工作日日均 GMV<b>${fmtMoney(wkAvg)}</b></div>
                    <div class="summary-chip good">周末日均 GMV<b>${fmtMoney(weAvg)}</b></div>
                    <div class="summary-chip ${ratio >= 1 ? 'good' : 'warn'}">${ratioText}</div>
                </div>
                <div style="height:280px"><canvas id="weekdayChart"></canvas></div>
                <div class="chart-hint">基于 ${DAILY.dates.length} 天日度数据 · 可指导排班与投放节奏</div>
            `;

            const canvas = document.getElementById('weekdayChart');
            if (!canvas) return;
            charts.push(new Chart(canvas, {
                type: 'bar',
                data: {
                    labels: avg.map(a => a.label),
                    datasets: [{
                        label: '日均 GMV',
                        data: avg.map(a => a.gmv),
                        backgroundColor: avg.map(a => a.isWeekend ? '#4f46e5' : '#c7cbd4'),
                        borderRadius: 6,
                    }]
                },
                options: {
                    responsive: true, maintainAspectRatio: false,
                    plugins: {
                        legend: { display: false },
                        tooltip: { callbacks: { label: c => '日均 GMV：¥' + c.raw.toLocaleString() } }
                    },
                    scales: {
                        x: { grid: { display: false } },
                        y: { grid: { color: '#f0f2f5' }, ticks: { callback: v => v >= 10000 ? (v/10000).toFixed(1)+'万' : v } }
                    }
                }
            }));
        }

        // ----- Module: consecutive decline detection (daily mode) -----
        function renderDeclinePanel() {
            const card = document.getElementById('declinePanelCard');
            const el = document.getElementById('declinePanelBody');
            if (!card || !el) return;
            // Needs per-date granularity: daily mode only.
            if (appMode !== 'daily' || !DAILY || !DAILY.dates || DAILY.dates.length < 3) {
                card.style.display = 'none';
                return;
            }
            card.style.display = '';

            const dates = DAILY.dates;
            // Build per-store GMV time series across all available dates.
            const series = {};   // storeId -> { name, city, values: [gmv per date] }
            dates.forEach(d => {
                const entry = DAILY.daily[d];
                if (!entry || !entry.cities) return;
                Object.values(entry.cities).forEach(c => {
                    Object.values(c.districts || {}).forEach(dist => {
                        (dist.stores || []).forEach(s => {
                            if (!series[s.id]) {
                                const meta = getStoreMeta(s.id) || {};
                                series[s.id] = { id: s.id, name: meta.name || s.id, city: meta.city || '', values: [] };
                            }
                            series[s.id].values.push((s.metrics && s.metrics.gmv) || 0);
                        });
                    });
                });
            });

            // Detect runs of >=2 consecutive day-over-day drops, ending on the
            // latest day (most actionable) or anywhere; record the longest run.
            const declines = [];
            Object.values(series).forEach(st => {
                const v = st.values;
                let maxRun = 0, runLen = 0, runEnd = -1;
                for (let i = 1; i < v.length; i++) {
                    if (v[i] < v[i - 1]) {
                        runLen++;
                        if (runLen > maxRun) { maxRun = runLen; runEnd = i; }
                    } else {
                        runLen = 0;
                    }
                }
                if (maxRun >= 2) {
                    const start = runEnd - maxRun;      // first index of the run's drop (values[start-1] -> values[start])
                    const fromVal = v[start - 1] || 0;
                    const toVal = v[runEnd] || 0;
                    const dropPct = fromVal > 0 ? (fromVal - toVal) / fromVal * 100 : 0;
                    declines.push({
                        store: st,
                        runLen: maxRun,
                        startDate: dates[start - 1],
                        endDate: dates[runEnd],
                        fromVal, toVal, dropPct,
                    });
                }
            });
            declines.sort((a, b) => b.dropPct - a.dropPct);

            const MAX = 20;
            const shown = declines.slice(0, MAX);
            const stillDropping = declines.filter(d => d.endDate === dates[dates.length - 1]).length;

            el.innerHTML = `
                <div class="summary-chips">
                    <div class="summary-chip danger">连续下滑门店<b>${declines.length}</b></div>
                    <div class="summary-chip danger">截至最新日仍在跌<b>${stillDropping}</b></div>
                    <div class="summary-chip">最大连降<b>${declines.length ? Math.max(...declines.map(d => d.runLen)) : 0} 天</b></div>
                </div>
                ${declines.length === 0
                    ? '<div class="chart-hint">近 ' + dates.length + ' 天内没有门店出现连续 2 天及以上 GMV 下滑</div>'
                    : `<table>
                        <thead><tr><th>#</th><th>门店</th><th>城市</th><th>连降天数</th><th>区间</th><th>起始 GMV</th><th>当前 GMV</th><th>累计跌幅</th></tr></thead>
                        <tbody>
                            ${shown.map((d, i) => `
                                <tr onclick="drillToStoreById('${jsStr(d.store.id)}')">
                                    <td><span class="rank-badge rank-other">${i+1}</span></td>
                                    <td style="font-weight:600">${esc(shortStoreName(d.store.name))}</td>
                                    <td>${esc(d.store.city)}</td>
                                    <td><span class="alert-tag alert-high">${d.runLen} 天</span></td>
                                    <td style="font-size:12px;color:#6b7280">${d.startDate} → ${d.endDate}</td>
                                    <td>${fmtMoney(d.fromVal)}</td>
                                    <td style="font-weight:600;color:#dc2626">${fmtMoney(d.toVal)}</td>
                                    <td style="font-weight:600;color:#dc2626">-${d.dropPct.toFixed(1)}%</td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                    ${declines.length > MAX ? '<div class="chart-hint">仅显示跌幅最大的前 ' + MAX + ' 家，共 ' + declines.length + ' 家连降</div>' : '<div class="chart-hint">👆 点击行进入门店详情 · 连续下滑比单日下跌更能反映趋势问题</div>'}`
                }
            `;
        }

            const totalQueue = withWait.reduce((a, s) => a + (s.metrics.queue_users || 0), 0);

        function renderRetentionPanel(stores) {

            const withOld = stores.filter(s => (s.metrics.old_customer_ratio || 0) > 0);

            if (withOld.length === 0 && withRep.length === 0) {
                el.innerHTML = '<div class="chart-hint">暂无留存口径数据（数据源未提供或尚未接入）</div>';
                return;

            // 汇总：老客占比、历史60天复购率（按核销人数加权）、过去两月核销占比
            const totalVerified = stores.reduce((a, s) => a + (s.metrics.verified || 0), 0);

                ? stores.reduce((a, s) => a + (s.metrics.verified || 0) * (s.metrics.old_customer_ratio || 0), 0) / totalVerified

        function renderVerifyBenchmarkPanel(stores) {
            const el = document.getElementById('verifyBenchmarkBody');
            if (!el) return;

            const withCum = stores.filter(s => (s.metrics.verify_rate_cum || 0) > 0);
            if (withCum.length === 0) {
                el.innerHTML = '<div class="chart-hint">暂无核销对标数据（数据源未提供或尚未接入）</div>';
                return;
            }

            // 加权核销率：累计至今 vs 次月+7天
            const totalVerified = stores.reduce((a, s) => a + (s.metrics.verified || 0), 0);
            const wCum = totalVerified > 0 ? stores.reduce((a, s) => a + (s.metrics.verified || 0) * (s.metrics.verify_rate_cum || 0), 0) / totalVerified : 0;
            const wM1 = totalVerified > 0 ? stores.reduce((a, s) => a + (s.metrics.verified || 0) * (s.metrics.verify_rate_m1 || 0), 0) / totalVerified : 0;

            // 分渠道 GTV 加总
            const gtvDouyin = stores.reduce((a, s) => a + (s.metrics.douyin_gtv || 0), 0);
            const gtvMeituan = stores.reduce((a, s) => a + (s.metrics.meituan_gtv || 0), 0);
            const gtvMini = stores.reduce((a, s) => a + (s.metrics.miniprogram_gtv || 0), 0);
            const gtvTotal = gtvDouyin + gtvMeituan + gtvMini;

            // 累计核销率最低门店（真实核销进度落后）
            const lowCum = withCum.slice().sort((a, b) => (a.metrics.verify_rate_cum || 0) - (b.metrics.verify_rate_cum || 0)).slice(0, 10);

            const cumRow = s => `
                <tr onclick="drillToStoreById('${jsStr(s.id)}')">

                    <td>${esc(s.city)}</td>
                    <td style="font-weight:600;color:${(s.metrics.verify_rate_cum || 0) >= 50 ? '#16a34a' : '#d97706'}">${(s.metrics.verify_rate_cum || 0).toFixed(1)}%</td>
                    <td>${(s.metrics.verify_rate_m1 || 0).toFixed(1)}%</td>
                    <td>${(s.metrics.douyin_verify_rate_cum || 0).toFixed(1)}%</td>
                    <td>${(s.metrics.meituan_verify_rate_cum || 0).toFixed(1)}%</td>
                </tr>`;

            const pct = v => gtvTotal > 0 ? (v / gtvTotal * 100).toFixed(1) + '%' : '—';

            el.innerHTML = `
                <div class="summary-chips">
                    <div class="summary-chip">累计核销率<b>${wCum.toFixed(1)}%</b></div>
                    <div class="summary-chip">次月+7天核销率<b>${wM1.toFixed(1)}%</b></div>
                    <div class="summary-chip">抖音GTV<b>${fmtMoney(gtvDouyin)}</b></div>
                    <div class="summary-chip">美团GTV<b>${fmtMoney(gtvMeituan)}</b></div>
                    <div class="summary-chip">小程序GTV<b>${fmtMoney(gtvMini)}</b></div>
                </div>
                <div class="alert-sec-head" style="margin:4px 0 8px">🔻 累计核销率最低门店（真实核销进度落后）</div>
                <table>
                    <thead><tr><th>门店</th><th>城市</th><th>累计至今</th><th>次月+7天</th><th>抖音累计</th><th>美团累计</th></tr></thead>
                    <tbody>${lowCum.map(cumRow).join('')}</tbody>
                </table>
                <div class="chart-hint" style="text-align:left">「累计至今 / 次月+7天」是标准对标窗口口径，让不同月份之间核销率可比；分渠道 GTV 构成：抖音 ${pct(gtvDouyin)} / 美团 ${pct(gtvMeituan)} / 小程序 ${pct(gtvMini)}。</div>

        function renderStarScorePanel(stores) {
            const el = document.getElementById('starScorePanelBody');
            if (!el) return;

            // Only stores with a meaningful score/star are counted.
            const withStar = stores.filter(s => (s.star_level || 0) > 0);
            const withScore = stores.filter(s => (s.operation_score || 0) > 0);
            if (withStar.length === 0 && withScore.length === 0) {
                el.innerHTML = '<div class="chart-hint">暂无星级 / 经营分数据（数据源未提供或尚未接入）</div>';
                return;
            }

            // Star distribution（按 0.1 精度展示，保留 4.1 分这类小数星级）
            const starDist = {};
            withStar.forEach(s => {
                const k = (s.star_level || 0).toFixed(1);
                starDist[k] = (starDist[k] || 0) + 1;
            });
            const starLabels = Object.keys(starDist).sort((a, b) => parseFloat(a) - parseFloat(b));

            // Low-star stores (star < 4.5) sorted by operation score ascending.
            const lowStar = withStar.filter(s => (s.star_level || 0) < 4.5)
                .sort((a, b) => (a.operation_score || 0) - (b.operation_score || 0));

            // Lowest operation-score stores.
            const lowScore = withScore.slice().sort((a, b) => (a.operation_score || 0) - (b.operation_score || 0)).slice(0, 10);

            const starRow = s => `
                <tr onclick="drillToStoreById('${jsStr(s.id)}')">

                    <td>${esc(s.city)}</td>

                    <td style="font-weight:600;color:${(s.operation_score || 0) >= 80 ? '#16a34a' : (s.operation_score || 0) >= 60 ? '#d97706' : '#dc2626'}">${s.operation_score || 0}</td>
                </tr>`;

            el.innerHTML = `
                <div class="summary-chips">
                    <div class="summary-chip">有星级门店<b>${withStar.length} / ${stores.length}</b></div>
                    <div class="summary-chip warn">低星门店（&lt;4.5分）<b>${lowStar.length}</b></div>
                    <div class="summary-chip">平均经营分<b>${withScore.length ? (withScore.reduce((a, s) => a + (s.operation_score || 0), 0) / withScore.length).toFixed(1) : '—'}</b></div>
                </div>
                <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px">
                    <div>
                        <div style="height:220px"><canvas id="starDistChart"></canvas></div>
                        <div class="chart-hint">门店星级分布（精确到 0.1 分）</div>
                    </div>
                    <div>
                        <table>
                            <thead><tr><th>门店</th><th>城市</th><th>星级</th><th>经营分</th></tr></thead>
                            <tbody>${(lowStar.length ? lowStar : lowScore).slice(0, 10).map(starRow).join('')}</tbody>
                        </table>
                        <div class="chart-hint">👆 低星 / 低分门店 · 经营分 &lt;60 需重点关注平台流量权重</div>
                    </div>
                </div>
            `;

            const canvas = document.getElementById('starDistChart');
            if (!canvas) return;
            charts.push(new Chart(canvas, {
                type: 'bar',
                data: {
                    labels: starLabels.map(l => l + ' 分'),
                    datasets: [{
                        label: '门店数',
                        data: starLabels.map(l => starDist[l] || 0),
                        backgroundColor: '#d97706',
                        borderRadius: 6,
                    }]
                },
                options: {
                    responsive: true, maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: { x: { grid: { display: false } }, y: { grid: { color: '#f0f2f5' }, ticks: { stepSize: 1 } } }
                }
            }));
        }
        function percentile(sorted, p) {
            if (!sorted || sorted.length === 0) return 0;
            const idx = (sorted.length - 1) * p;
            const lo = Math.floor(idx), hi = Math.ceil(idx);
            if (lo === hi) return sorted[lo];
            return sorted[lo] + (sorted[hi] - sorted[lo]) * (idx - lo);
        }

        function computeFunnelTotals(stores) {
            const t = { visitors: 0, conversions: 0, verified: 0, new_customers: 0, gmv: 0, gtv: 0,
                        refundW: 0, refundGmvW: 0, visMomW: 0, saturation: 0, efficiency: 0, queueUsers: 0,
                        successW: 0, uptick: 0, repurchase: 0, n: 0, chVisitors: {}, chConversions: {} };
            stores.forEach(s => {
                const m = s.metrics;
                t.visitors += m.visitors || 0;
                t.verified += m.verified || 0;
                t.new_customers += m.new_customers || 0;
                t.gmv += m.gmv || 0;
                t.gtv += m.gtv || 0;
                t.saturation += m.saturation || 0;
                t.efficiency += m.efficiency || 0;
                t.uptick += m.uptick_rate || 0;
                t.repurchase += m.repurchase || 0;
                t.queueUsers += m.queue_users || 0;
                t.successW += (m.queue_users || 0) * (m.success_queue_rate || 0);
                t.visMomW += (m.visitors || 0) * (m.visitors_mom || 0);
                t.n++;
                Object.entries(s.channels || {}).forEach(([name, c]) => {
                    t.conversions += c.conversions || 0;
                    t.refundW += (c.gmv || 0) * (c.refund_rate || 0);
                    t.refundGmvW += c.gmv || 0;
                    t.chVisitors[name] = (t.chVisitors[name] || 0) + (c.visitors || 0);
                    t.chConversions[name] = (t.chConversions[name] || 0) + (c.conversions || 0);
                });
            });
            t.conversion_rate = t.visitors > 0 ? t.conversions / t.visitors * 100 : 0;
            t.verify_rate = t.conversions > 0 ? t.verified / t.conversions * 100 : 0;
            t.old_customers = t.verified - t.new_customers;
            t.old_ratio = t.verified > 0 ? Math.max(t.old_customers, 0) / t.verified * 100 : 0;
            t.new_ratio = 100 - t.old_ratio;
            t.refund_rate = t.refundGmvW > 0 ? t.refundW / t.refundGmvW : 0;
            t.visitors_mom = t.visitors > 0 ? t.visMomW / t.visitors : 0;
            t.avg_saturation = t.n ? t.saturation / t.n : 0;
            t.avg_efficiency = t.n ? t.efficiency / t.n : 0;
            t.avg_uptick = t.n ? t.uptick / t.n : 0;
            t.avg_repurchase = t.n ? t.repurchase / t.n : 0;
            t.queue_success = t.queueUsers > 0 ? t.successW / t.queueUsers : 0;
            t.aov = t.verified > 0 ? t.gtv / t.verified : 0;
            return t;
        }

        function chShareStr(chMap, total) {
            return Object.entries(chMap).sort((a, b) => b[1] - a[1]).map(([name, v]) =>
                name + ' ' + (total > 0 ? (v / total * 100).toFixed(0) : 0) + '%'
            ).join(' · ');
        }

        function renderCityFunnelTable(src, allStores) {
            const el = document.getElementById('cityFunnelBody');
            if (!el) return;
            const nat = computeFunnelTotals(allStores);
            const rows = Object.entries(src.cities || {}).map(([name, c]) => {
                const cityStores = [];
                Object.values(c.districts || {}).forEach(d => (d.stores || []).forEach(s => cityStores.push(s)));
                return [name, computeFunnelTotals(cityStores)];
            }).sort((a, b) => b[1].visitors - a[1].visitors);

            const diag = t => {
                const tags = [];
                const checks = [
                    { cond: t.conversion_rate < nat.conversion_rate * 0.7, mid: t.conversion_rate < nat.conversion_rate * 0.85, tag: '转化弱' },
                    { cond: t.verify_rate < nat.verify_rate * 0.7, mid: t.verify_rate < nat.verify_rate * 0.85, tag: '履约弱' },
                    { cond: t.repurchase > 0 ? t.avg_repurchase < nat.avg_repurchase * 0.7 : false, mid: t.repurchase > 0 ? t.avg_repurchase < nat.avg_repurchase * 0.85 : false, tag: '留存弱' },
                ];
                checks.forEach(c => {
                    if (c.cond) tags.push('<span class="diag-tag diag-bad">' + c.tag + '</span>');
                    else if (c.mid) tags.push('<span class="diag-tag diag-mid">' + c.tag + '</span>');
                });
                return tags.join('') || '<span class="diag-tag diag-good">健康</span>';
            };

            el.innerHTML = `
                <table>
                    <thead><tr><th>城市</th><th>访问</th><th>成交</th><th>转化率</th><th>核销</th><th>核销率</th><th>老客占比</th><th>复购率</th><th>薄弱环节</th></tr></thead>
                    <tbody>
                        ${rows.map(([name, t]) => `
                            <tr onclick="drillToCity('${jsStr(name)}')">
                                <td style="font-weight:600">${name}</td>
                                <td>${fmtNum(t.visitors)}</td>
                                <td>${fmtNum(t.conversions)}</td>
                                <td style="color:${t.conversion_rate < nat.conversion_rate * 0.85 ? '#dc2626' : '#374151'};font-weight:${t.conversion_rate < nat.conversion_rate * 0.85 ? 600 : 400}">${fmtPct(t.conversion_rate)}</td>
                                <td>${fmtNum(t.verified)}</td>
                                <td style="color:${t.verify_rate < nat.verify_rate * 0.85 ? '#dc2626' : '#374151'};font-weight:${t.verify_rate < nat.verify_rate * 0.85 ? 600 : 400}">${fmtPct(t.verify_rate)}</td>
                                <td>${t.old_ratio.toFixed(1)}%</td>

                                <td>${diag(t)}</td>
                            </tr>
                        `).join('')}

            `;
        }

        function renderStoreDiagnosis(stores) {
            const el = document.getElementById('storeDiagBody');
            if (!el) return;
            if (stores.length < 8) { el.innerHTML = '<div class="chart-hint">门店数过少，不做分位诊断</div>'; return; }

            const convArr = stores.map(s => s.metrics.conversion_rate).sort((a, b) => a - b);
            const verArr = stores.map(s => s.metrics.verify_rate).sort((a, b) => a - b);
            const repArr = stores.map(s => s.metrics.repurchase).sort((a, b) => a - b);
            const refundArr = stores.map(s => s.metrics.refund_rate).sort((a, b) => a - b);
            const visArr = stores.map(s => s.metrics.visitors).sort((a, b) => a - b);
            const verifArr = stores.map(s => s.metrics.verified).sort((a, b) => a - b);

            const P25c = percentile(convArr, 0.25), P60c = percentile(convArr, 0.60);
            const P25v = percentile(verArr, 0.25), P60v = percentile(verArr, 0.60);
            const P25r = percentile(repArr, 0.25), P60r = percentile(repArr, 0.60);
            const P75rf = percentile(refundArr, 0.75);
            const medVis = percentile(visArr, 0.5), medVerif = percentile(verifArr, 0.5);

            const results = [];
            let benchmarkCount = 0;
            stores.forEach(s => {
                const m = s.metrics;
                const probs = [];
                if (m.visitors >= medVis && m.conversion_rate < P25c) probs.push({ tag: '转化弱', cls: 'diag-bad', why: '有流量没转化' });
                if (m.verify_rate < P25v || m.refund_rate > P75rf) probs.push({ tag: '履约弱', cls: 'diag-bad', why: m.refund_rate > P75rf ? '退款率偏高' : '成交后核销低' });
                if (m.verified >= medVerif && m.repurchase < P25r) probs.push({ tag: '留存弱', cls: 'diag-mid', why: '有客源不复购' });
                if (probs.length === 0 && m.conversion_rate >= P60c && m.verify_rate >= P60v && m.repurchase >= P60r) {
                    benchmarkCount++;
                    results.push({ store: s, probs: [{ tag: '标杆店', cls: 'diag-good', why: '三率均进前40%' }], benchmark: true });
                } else if (probs.length > 0) {
                    results.push({ store: s, probs, benchmark: false });
                }
            });
            const problemStores = results.filter(r => !r.benchmark).sort((a, b) => b.probs.length - a.probs.length);
            const counts = {};
            problemStores.forEach(r => r.probs.forEach(p => { counts[p.tag] = (counts[p.tag] || 0) + 1; }));

                    <div class="summary-chip warn">留存弱<b>${counts['留存弱'] || 0}家</b></div>

                        ${shown.map((r, i) => `
                            <tr onclick="drillToStoreById('${jsStr(r.store.id)}')">
                                <td><span class="rank-badge rank-other">${i+1}</span></td>
                                <td style="font-weight:600">${esc(shortStoreName(r.store.name))}</td>
                                <td>${r.store.city}</td>
                                <td>${r.probs.map(p => '<span class="diag-tag ' + p.cls + '" title="' + p.why + '">' + p.tag + '</span>').join('')}</td>
                                <td style="color:${r.store.metrics.conversion_rate < P25c ? '#dc2626' : '#374151'}">${fmtPct(r.store.metrics.conversion_rate)}</td>
                                <td style="color:${r.store.metrics.verify_rate < P25v ? '#dc2626' : '#374151'}">${fmtPct(r.store.metrics.verify_rate)}</td>
                                <td style="color:${r.store.metrics.repurchase < P25r ? '#dc2626' : '#374151'}">${fmtPct(r.store.metrics.repurchase)}</td>
                                <td style="color:${r.store.metrics.refund_rate > P75rf ? '#dc2626' : '#374151'}">${fmtPct(r.store.metrics.refund_rate)}</td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
                <div class="chart-hint">分位基准：转化率P25=${fmtPct(P25c)} · 核销率P25=${fmtPct(P25v)} · 复购率P25=${fmtPct(P25r)} · 退款率P75=${fmtPct(P75rf)}。转化弱=流量高于中位但转化率进后25%；标杆店=三率均进前40%。👆 点击行进入门店详情${problemStores.length > 20 ? ' · 仅显示前20家' : ''}</div>

        function barTabsHTML(scope) {
            return BAR_METRICS.map((m, i) => {

                    : 'background:#f0f2f5;color:#6b7280;border:1px solid #e0e3eb;';
                return '<span id="' + scope + m.key + 'Tab" style="cursor:pointer;padding:3px 12px;font-size:12px;font-weight:500;' + radius + bg + '">' + m.label + '</span>';

            BAR_METRICS.forEach(m => {

                    tab.style.background = '#f0f2f5';

            });

        function barChartLabel(metric) {
            if (metric === 'gmv') return 'GMV（万元）';
            if (metric === 'gtv') return 'GTV（万元）';
            return '访问人数';
        }

        function barChartValues(items, metric, getVal) {
            if (metric === 'visitors') return items.map(getVal);
            return items.map(getVal).map(v => v / 10000);
        }

        // Generic bar chart renderer + switcher for each level
        function renderLevelBarChart(items, metric, getVal, getLabel, onClick) {
            const sorted = [...items].sort((a, b) => getVal(b) - getVal(a));
            const values = barChartValues(sorted, metric, getVal);
            const labelText = barChartLabel(metric);
            const existing = charts.find(c => c.canvas && c.canvas.id === 'barChart');
            if (existing) { existing.destroy(); charts = charts.filter(c => c !== existing); }
            renderBarChart('barChart',
                sorted.map(getLabel),
                values,
                labelText,
                sorted.map((item, i) => COLORS[i % COLORS.length]),
                idx => onClick(sorted[idx], idx)
            );
        }

        function switchLevelBarMetric(scope, items, metric, getVal, getLabel, onClick) {
            currentBarMetric = metric;
            updateBarTabs(scope, metric);
            renderLevelBarChart(items, metric, getVal, getLabel, onClick);

        function colConfig(key) { return TABLE_COLUMNS.find(c => c.key === key); }

            const cfg = colConfig(col);
            if (!cfg) return '';
            return cfg.from === 'store' ? st[col] : st.metrics[col];
        }

        function renderStoreTableHead() {
            const head = document.getElementById('storeTableHead');
            if (!head) return;
            let html = '<tr><th>排名</th>';
            visibleColumns.forEach(key => {
                const cfg = colConfig(key);
                if (!cfg) return;
                const arrow = key === tableSortCol ? (tableSortDir === 'asc' ? ' ↑' : ' ↓') : '';
                const color = key === tableSortCol ? 'color:#4f46e5' : '';
                html += '<th class="sortable" style="' + color + '" onclick="sortStoreTable(\'' + key + '\')">' + cfg.label + arrow + '</th>';
            });
            html += '</tr>';

            let list = _level2Stores.slice();
            if (storeTypeFilter !== 'all') list = list.filter(st => st.store_type === storeTypeFilter);
            list.sort((a, b) => {
                const av = colValue(a, tableSortCol);
                const bv = colValue(b, tableSortCol);
                if (typeof av === 'string') return tableSortDir === 'asc' ? av.localeCompare(bv) : bv.localeCompare(av);
                return tableSortDir === 'asc' ? av - bv : bv - av;
            });
            const body = document.getElementById('storeTableBody');

                                    <td>${fmtNum(c.conversions)}</td>
                                    <td>${fmtPct(c.conversion_rate)}</td>
                                    <td style="font-weight:600;color:#4f46e5">${fmtMoney(c.gmv)}</td>
                                    <td>${fmtMoney(c.gtv)}</td>
                                    <td>¥${c.aov}</td>
                                    <td>${fmtPct(c.refund_rate)}</td>
                                    <td>${fmtPct(c.verify_rate)}</td>
                                    <td>${fmtPct(c.discount)}</td>
                                </tr>`;
                            }).join('')}
                        </tbody>
                    </table>
                </div>

                <!-- Extended metrics -->
                <div class="table-card">
                    <h3>📊 门店运营指标</h3>
                    <table>
                        <thead><tr><th>指标</th><th>数值</th><th>指标</th><th>数值</th><th>指标</th><th>数值</th></tr></thead>
                        <tbody>
                            <tr style="cursor:default">
                                <td>日均美甲师数量</td><td>${m.manicurist_count}</td>
                                <td>门店日均服务次数</td><td>${m.daily_service_count}</td>
                                <td>门店日均服务人数</td><td>${m.daily_service_users}</td>
                            </tr>
                            <tr style="cursor:default">
                                <td>美甲师日均人效</td><td>¥${m.efficiency}</td>
                                <td>升单率</td><td>${fmtPct(m.uptick_rate)}</td>
                                <td>工位饱和率</td><td>${fmtPct(m.saturation)}</td>
                            </tr>
                            <tr style="cursor:default">
                                <td>评价数</td><td>${fmtNum(m.reviews)}</td>
                                <td>好评数</td><td>${fmtNum(m.good_reviews)}</td>
                                <td>差评数</td><td>${fmtNum(m.bad_reviews)}</td>
                            </tr>
                            <tr style="cursor:default">
                                <td>原价核销金额</td><td>${fmtMoney(m.original_amount)}</td>
                                <td>退款率</td><td>${fmtPct(m.refund_rate)}</td>
                                <td>订单核销率</td><td>${fmtPct(m.verify_rate)}</td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <!-- Store diagnosis（渠道归因 + 预警 + 漏斗 + 渠道质量） -->
                <div id="storeBizAnalysis"></div>
            `;

            // Render charts
            if (chKeys.length > 0) {
                renderChannelCompareChart('channelCompareChart', ch);
            }
            renderRadarChart('radarChart', m);
            renderStoreBusinessAnalysis(store);
        }

        // ===== Navigation =====
        function drillToCity(cityName) {
            currentLevel = 1;
            currentPath = { city: cityName, district: null, storeId: null };
            renderAll();
        }

        function drillToDistrict(districtName) {
            currentLevel = 2;
            currentPath.district = districtName;
            currentPath.storeId = null;
            renderAll();
        }

        function drillToStore(storeId) {
            currentLevel = 3;
            currentPath.storeId = storeId;
            renderAll();
        }

        function navigateTo(level) {
            currentLevel = level;
            if (level <= 2) currentPath.storeId = null;
            if (level <= 1) currentPath.district = null;
            if (level === 0) currentPath.city = null;
            renderAll();
        }

        // Chart.js defaults
        Chart.defaults.font.family = "-apple-system, 'PingFang SC', sans-serif";
        Chart.defaults.font.size = 11;
        Chart.defaults.color = '#6b7280';

        // ===== 逐日趋势柱状图悬浮提示（鼠标悬停即时显示数值）=====
        (function () {
            const tip = document.createElement('div');
            tip.className = 'tr-tip';
            document.body.appendChild(tip);
            document.addEventListener('mouseover', function (e) {
                const col = e.target && e.target.closest ? e.target.closest('.tr-col') : null;
                if (col && col.getAttribute('data-tip')) {
                    tip.textContent = col.getAttribute('data-tip');
                    const r = col.getBoundingClientRect();
                    tip.style.left = (r.left + r.width / 2) + 'px';
                    tip.style.top = r.top + 'px';
                    tip.classList.add('show');
                } else {
                    tip.classList.remove('show');
                }
            });
        })();

        // Initial render — placed last so every const/function above is ready.
        renderAll();
    </script>
</body>
</html>
