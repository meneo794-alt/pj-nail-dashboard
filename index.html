    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background: #f5f7fa; color: #1a1a2e; min-height: 100vh;
        }
        /* Month selector / period scope (多期次切换) */
        .month-sel-wrap { display: inline-flex; align-items: center; gap: 8px; margin-right: 12px; font-size: 13px; color: rgba(255,255,255,0.92); }
        .month-sel-wrap select { appearance: auto; background: rgba(255,255,255,0.95); color: #1a1a2e; border: 1px solid rgba(255,255,255,0.5); border-radius: 8px; padding: 6px 10px; font-size: 13px; max-width: min(420px, 70vw); }
        .top-scope { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; max-width: 1400px; margin: 0 auto; padding: 8px 24px 0; font-size: 13px; color: #4b5563; }
        .top-scope .chip { display: inline-flex; align-items: center; gap: 4px; padding: 3px 10px; border-radius: 999px; background: #f3f4f6; border: 1px solid #e5e7eb; font-size: 12px; color: #374151; }
        .top-scope .chip.warn { background: #fff7e6; border-color: #ffe7ba; color: #ad6800; font-weight: 600; }
        .chip { display: inline-flex; align-items: center; gap: 4px; padding: 3px 10px; border-radius: 999px; background: #f3f4f6; border: 1px solid #e5e7eb; font-size: 12px; color: #374151; }
        .chip.warn { background: #fff7e6; border-color: #ffe7ba; color: #ad6800; font-weight: 600; }

        /* Header */
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white; padding: 20px 32px; box-shadow: 0 2px 12px rgba(0,0,0,0.08);
        }
        .header-content { display: flex; justify-content: space-between; align-items: center; max-width: 1400px; margin: 0 auto; }
        .header h1 { font-size: 22px; font-weight: 600; }
        .header .date { font-size: 13px; opacity: 0.85; margin-top: 4px; }
        .header-right .badge { display: inline-flex; align-items: center; gap: 6px; background: rgba(255,255,255,0.2); padding: 6px 14px; border-radius: 20px; font-size: 13px; }
        .pulse-dot { width: 8px; height: 8px; background: #4ade80; border-radius: 50%; animation: pulse 2s infinite; }
        @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

        .container { max-width: 1400px; margin: 0 auto; padding: 20px 32px; }

        /* Breadcrumb */
        .breadcrumb { display: flex; align-items: center; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
        .breadcrumb-item { padding: 6px 14px; background: white; border: 1px solid #e0e3eb; border-radius: 20px; font-size: 13px; cursor: pointer; transition: all 0.15s; display: flex; align-items: center; gap: 4px; }
        .breadcrumb-item:hover { background: #667eea; color: white; border-color: #667eea; }
        .breadcrumb-item.active { background: #4f46e5; color: white; border-color: #4f46e5; cursor: default; }
        .breadcrumb-sep { color: #c0c5cf; font-size: 12px; }

        /* Metric Cards */
        .metrics-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 20px; }
        .metric-card { background: white; border-radius: 12px; padding: 16px 18px; box-shadow: 0 1px 4px rgba(0,0,0,0.06); border: 1px solid #eef0f4; transition: transform 0.15s; }
        .metric-card:hover { transform: translateY(-1px); box-shadow: 0 3px 12px rgba(0,0,0,0.08); }
        .metric-card .label { font-size: 12px; color: #8895a7; margin-bottom: 6px; display: flex; align-items: center; gap: 6px; }
        .metric-card .value { font-size: 22px; font-weight: 700; margin-bottom: 3px; }
        .metric-card .change { font-size: 11px; display: flex; align-items: center; gap: 3px; }
        .change.up { color: #10b981; } .change.down { color: #ef4444; } .change.neutral { color: #6b7280; }
        .metric-icon { width: 26px; height: 26px; border-radius: 6px; display: inline-flex; align-items: center; justify-content: center; font-size: 13px; }

        /* Charts */
        .charts-row { display: grid; grid-template-columns: 1.4fr 1fr; gap: 14px; margin-bottom: 20px; }
        .chart-card { background: white; border-radius: 12px; padding: 18px 20px; box-shadow: 0 1px 4px rgba(0,0,0,0.06); border: 1px solid #eef0f4; }
        .chart-card h3 { font-size: 14px; font-weight: 600; margin-bottom: 14px; display: flex; justify-content: space-between; align-items: center; }
        .chart-card h3 .tag { font-size: 11px; font-weight: 400; color: #8895a7; background: #f0f2f5; padding: 2px 10px; border-radius: 10px; }
        .chart-container { position: relative; height: 260px; }
        .chart-hint { font-size: 11px; color: #8895a7; margin-top: 8px; text-align: center; }

        /* Table */
        .table-card { background: white; border-radius: 12px; padding: 18px 20px; box-shadow: 0 1px 4px rgba(0,0,0,0.06); border: 1px solid #eef0f4; margin-bottom: 20px; }
        .table-card h3 { font-size: 14px; font-weight: 600; margin-bottom: 14px; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        thead th { text-align: left; padding: 10px 12px; background: #f8f9fb; color: #6b7280; font-weight: 600; font-size: 12px; border-radius: 6px 6px 0 0; }
        /* 产能表列较多：表头与城市列不折行，避免「人均日均服\n务」「杭州\n市」这种断字 */
        #capacityTableBody thead th { white-space: nowrap; }
        #capacityTableBody tbody td:nth-child(2) { white-space: nowrap; }
        #capacityTableBody tbody td:nth-child(3) { white-space: nowrap; }
        #capacityTableBody tbody td:nth-child(3) .store-type-badge { white-space: nowrap; }
        #trafficChannelBody thead th { white-space: nowrap; }
        #trafficChannelBody tbody td:nth-child(2),
        #trafficChannelBody tbody td:nth-child(3) { white-space: nowrap; }
        /* 人员面板：表头「满编率」「在职/工位」与城市列不折行 */
        #staffPanelBody thead th { white-space: nowrap; }
        #staffPanelBody tbody td:nth-child(2) { white-space: nowrap; }
        /* 渠道单元格（访问/转化/核销三行小字）不允许逐字断行，否则「核 84.56%」会被拆成两行 */
        #trafficChannelBody tbody td:nth-child(n+4) { white-space: nowrap; }
        tbody td { padding: 10px 12px; border-bottom: 1px solid #f0f2f5; }
        tbody tr { cursor: pointer; transition: background 0.1s; }
        tbody tr:hover { background: #f0f4ff; }
        .rank-badge { display: inline-flex; align-items: center; justify-content: center; width: 20px; height: 20px; border-radius: 50%; font-size: 11px; font-weight: 700; }
        .rank-1 { background: #fef3c7; color: #d97706; } .rank-2 { background: #e0e7ff; color: #4f46e5; } .rank-3 { background: #fee2e2; color: #dc2626; } .rank-other { background: #f0f2f5; color: #6b7280; }
        .store-type-badge { font-size: 10px; padding: 2px 8px; border-radius: 8px; font-weight: 500; }
        .store-type-old { background: #dbeafe; color: #2563eb; } .store-type-new { background: #fef3c7; color: #d97706; }
        /* 美团牌级徽标（金牌 / 银牌 / 铜牌）：BI 不导出，来自 data/meituan_tier.csv 人工维护 */
        .tier-badge { display: inline-block; font-size: 10px; padding: 2px 8px; border-radius: 8px; font-weight: 600; white-space: nowrap; }
        .tier-gold   { background: linear-gradient(135deg,#fef3c7,#fde68a); color: #92400e; border: 1px solid #fcd34d; }
        .tier-silver { background: linear-gradient(135deg,#f1f5f9,#e2e8f0); color: #475569; border: 1px solid #cbd5e1; }
        .tier-bronze { background: linear-gradient(135deg,#ffedd5,#fed7aa); color: #9a3412; border: 1px solid #fdba74; }
        .tier-plain  { background: #f0f2f5; color: #6b7280; border: 1px solid #e5e7eb; }
        .sortable { cursor: pointer; user-select: none; }
        .sortable:hover { color: #4f46e5; }
        .col-settings-panel {
            display: none; position: absolute; right: 20px; top: 48px; z-index: 100;
            background: #fff; border: 1px solid #d0d5e0; border-radius: 8px;
            padding: 12px 16px; box-shadow: 0 4px 16px rgba(0,0,0,0.12);
            max-height: 320px; overflow-y: auto; min-width: 180px;
        }
        .col-settings-panel.show { display: block; }
        .col-settings-panel label { display: flex; align-items: center; gap: 6px; font-size: 12px; color: #374151; padding: 3px 0; cursor: pointer; }
        .col-settings-panel label:hover { color: #4f46e5; }
        .col-settings-panel input[type=checkbox] { width: 14px; height: 14px; accent-color: #4f46e5; }

        /* Store Detail */
        .store-detail-card { background: white; border-radius: 12px; padding: 18px 20px; box-shadow: 0 1px 4px rgba(0,0,0,0.06); border: 1px solid #eef0f4; margin-bottom: 20px; }
        .store-detail-card h3 { font-size: 14px; font-weight: 600; margin-bottom: 12px; }
        .store-info-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
        .store-info-item { font-size: 12px; }
        .store-info-item .si-label { color: #8895a7; margin-bottom: 2px; }
        .store-info-item .si-value { font-weight: 600; }
        /* 门店诊断：核心指标(左) + 逐日趋势(右) 左右分栏 */
        .diag-split { display: grid; grid-template-columns: 252px 1fr; gap: 20px; align-items: start; margin-top: 12px; }
        .diag-split .store-info-grid { grid-template-columns: 1fr; gap: 0; background: #f8f9fb; border: 1px solid #eef0f4; border-radius: 10px; padding: 4px 14px; }
        .diag-split .store-info-item { display: flex; align-items: baseline; justify-content: space-between; padding: 8px 0; border-bottom: 1px dashed #e8ebf0; }
        .diag-split .store-info-item:last-child { border-bottom: none; }
        .diag-split .si-label { color: #8895a7; margin-bottom: 0; font-size: 12.5px; }
        .diag-split .si-value { font-size: 16px; font-weight: 700; }
        .diag-right { min-width: 0; }
        .diag-right .tr-card { margin-top: 0; }
        @media (max-width: 900px) { .diag-split { grid-template-columns: 1fr; } }

        /* Bottom panels */
        .bottom-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
        .info-panel { background: white; border-radius: 12px; padding: 18px 20px; box-shadow: 0 1px 4px rgba(0,0,0,0.06); border: 1px solid #eef0f4; }
        .info-panel h3 { font-size: 14px; font-weight: 600; margin-bottom: 14px; }
        .info-item { display: flex; align-items: center; padding: 10px 0; border-bottom: 1px solid #f0f2f5; }
        .info-item:last-child { border-bottom: none; }
        .info-item .icon { width: 32px; height: 32px; border-radius: 8px; display: inline-flex; align-items: center; justify-content: center; font-size: 16px; margin-right: 10px; flex-shrink: 0; }
        .info-item .info-text { flex: 1; } .info-item .name { font-size: 13px; font-weight: 500; } .info-item .desc { font-size: 11px; color: #8895a7; margin-top: 2px; }
        .info-item .status { font-size: 11px; padding: 3px 8px; border-radius: 8px; font-weight: 500; }
        .status.active { background: #d1fae5; color: #059669; } .status.connected { background: #dbeafe; color: #2563eb; } .status.pending { background: #fef3c7; color: #d97706; }

        .loading { text-align: center; padding: 60px; font-size: 16px; color: #8895a7; }
        @media (max-width: 1024px) { .metrics-grid { grid-template-columns: repeat(2,1fr); } .charts-row, .bottom-grid { grid-template-columns: 1fr; } .store-info-grid { grid-template-columns: repeat(2,1fr); } }
        @media (max-width: 640px) { .container { padding: 14px; } .metrics-grid { grid-template-columns: 1fr; } .store-info-grid { grid-template-columns: 1fr; } }

        /* Mode switcher */
        .mode-switch { display: inline-flex; gap: 0; border-radius: 8px; overflow: hidden; border: 1px solid rgba(255,255,255,0.3); }
        .mode-btn { padding: 5px 16px; font-size: 13px; cursor: pointer; background: rgba(255,255,255,0.15); color: white; border: none; transition: all 0.15s; }
        .mode-btn.active { background: rgba(255,255,255,0.95); color: #4f46e5; font-weight: 600; }
        .date-bar { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; background: white; border-radius: 10px; padding: 10px 16px; border: 1px solid #eef0f4; }
        .date-bar label { font-size: 13px; color: #6b7280; font-weight: 500; }
        .date-bar select { font-size: 13px; padding: 4px 10px; border: 1px solid #d0d5e0; border-radius: 6px; background: white; color: #374151; cursor: pointer; }
        .date-bar .info { font-size: 12px; color: #8895a7; margin-left: auto; }
        .trend-card { background: white; border-radius: 12px; padding: 18px 20px; box-shadow: 0 1px 4px rgba(0,0,0,0.06); border: 1px solid #eef0f4; margin-bottom: 20px; }
        .trend-card h3 { font-size: 14px; font-weight: 600; margin-bottom: 14px; }
        .trend-container { position: relative; height: 300px; }

        /* ===== Alert / new modules ===== */
        .alert-tag { font-size: 10px; padding: 2px 8px; border-radius: 8px; font-weight: 500; margin-right: 4px; display: inline-block; white-space: nowrap; }
        .alert-high { background: #fee2e2; color: #dc2626; }
        .alert-mid { background: #fef3c7; color: #d97706; }
        .alert-ok { background: #d1fae5; color: #059669; }
        /* ===== 拒客嫌疑面板 ===== */
        .rj-ev { display: inline-block; background: #fff7ed; border: 1px solid #fed7aa; color: #9a3412; border-radius: 6px; padding: 1px 6px; font-size: 11px; margin: 1px 3px 1px 0; white-space: nowrap; }
        .rj-ev .rj-w { font-weight: 700; color: #dc2626; margin-right: 3px; }
        .rj-score { font-weight: 700; font-size: 14px; }
        .rj-tier { font-size: 10px; padding: 2px 8px; border-radius: 8px; font-weight: 600; white-space: nowrap; display: inline-block; }
        .rj-tier-high { background: #fee2e2; color: #dc2626; }
        .rj-tier-mid { background: #fef3c7; color: #d97706; }
        .rj-tier-low { background: #e0e7ff; color: #4f46e5; }
        .rj-busy { font-size: 10px; color: #0891b2; background: #e0f2fe; border-radius: 8px; padding: 1px 6px; white-space: nowrap; }
        .rj-foot { font-size: 11px; color: #6b7280; line-height: 1.9; border-top: 1px dashed #eef0f4; margin-top: 10px; padding-top: 8px; }
        .rj-fold > summary { cursor: pointer; font-size: 12px; color: #4f46e5; padding: 6px 0; user-select: none; }
        .summary-chips { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
        .summary-chip { background: #f8f9fb; border: 1px solid #eef0f4; border-radius: 8px; padding: 8px 14px; font-size: 12px; color: #6b7280; }
        .summary-chip b { font-size: 15px; color: #1a1a2e; display: block; margin-top: 2px; }
        .summary-chip.danger b { color: #dc2626; }
        .summary-chip.warn b { color: #d97706; }
        .summary-chip.good b { color: #059669; }
        .quality-bar { height: 8px; border-radius: 4px; background: #f0f2f5; overflow: hidden; min-width: 70px; }
        .quality-bar span { display: block; height: 100%; border-radius: 4px; }
        .panel-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 20px; }
        @media (max-width: 1024px) { .panel-grid { grid-template-columns: 1fr; } }
        .quadrant-legend { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 10px; font-size: 12px; color: #6b7280; }
        .quadrant-legend .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; margin-right: 5px; vertical-align: -1px; }

        /* ===== Funnel module ===== */
        .funnel-wrap { display: grid; grid-template-columns: 1.2fr 1fr; gap: 20px; }
        @media (max-width: 1024px) { .funnel-wrap { grid-template-columns: 1fr; } }
        .funnel-stage { margin: 0 auto; border-radius: 8px; padding: 12px 16px; text-align: center; color: #fff; min-width: 10%; transition: transform 0.15s; }
        .funnel-stage:hover { transform: scale(1.02); }
        .funnel-stage .fs-label { font-size: 12px; opacity: 0.9; }
        .funnel-stage .fs-value { font-size: 22px; font-weight: 700; line-height: 1.3; }
        .funnel-stage .fs-sub { font-size: 11px; opacity: 0.85; }
        .funnel-rate { display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 12px; color: #6b7280; padding: 4px 0; }
        .funnel-rate b { color: #4f46e5; font-size: 13px; }
        .funnel-rate .arrow { color: #c0c5cf; font-size: 14px; }
        .stage-cards { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin-top: 18px; }
        @media (max-width: 1024px) { .stage-cards { grid-template-columns: repeat(2, 1fr); } }
        @media (max-width: 640px) { .stage-cards { grid-template-columns: 1fr; } }
        .stage-card { background: #f8f9fb; border: 1px solid #eef0f4; border-radius: 10px; padding: 12px 14px; }
        .stage-card .sc-head { font-size: 12px; font-weight: 600; color: #4f46e5; margin-bottom: 8px; display: flex; align-items: center; gap: 6px; }
        .stage-card .sc-row { font-size: 11.5px; color: #6b7280; padding: 2px 0; display: flex; justify-content: space-between; }
        .stage-card .sc-row b { color: #1a1a2e; font-weight: 600; }
        .stage-card .sc-row b.bad { color: #dc2626; }
        .stage-card .sc-row b.good { color: #059669; }
        .diag-tag { font-size: 10px; padding: 2px 8px; border-radius: 8px; font-weight: 500; margin-right: 4px; display: inline-block; white-space: nowrap; }
        .diag-bad { background: #fee2e2; color: #dc2626; }
        .diag-mid { background: #fef3c7; color: #d97706; }
        .diag-good { background: #d1fae5; color: #059669; }
        /* 逐日趋势柱状图 */
        .tr-card { background: #fff; border: 1px solid #e5e7eb; border-radius: 10px; padding: 10px 14px 12px; margin-top: 10px; }
        .tr-ch { margin-top: 12px; padding-top: 12px; border-top: 1px dashed #e5e7eb; }
        .tr-ch:first-child { margin-top: 6px; padding-top: 0; border-top: none; }
        .tr-ch-head { font-size: 13px; font-weight: 700; color: #111827; margin-bottom: 4px; }
        .tr-metric { display: flex; align-items: center; gap: 16px; margin-top: 8px; }
        @media (max-width: 640px) { .tr-metric { flex-direction: column; align-items: stretch; gap: 6px; } }
        .tr-meta { width: 182px; flex: none; display: flex; flex-direction: column; gap: 3px; }
        @media (max-width: 640px) { .tr-meta { width: auto; } }
        .tr-m-head { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
        .tr-m-name { font-size: 12px; font-weight: 600; color: #374151; }
        .tr-badge { display: inline-block; font-size: 10.5px; padding: 0 7px; border-radius: 8px; font-weight: 600; line-height: 1.6; }
        .tr-m-sub { font-size: 11px; color: #6b7280; line-height: 1.4; }
        .tr-bars { flex: 1; display: flex; align-items: flex-end; gap: 4px; position: relative; padding: 0 1px; min-width: 0; }
        .tr-th { position: absolute; left: 0; right: 0; border-top: 1.5px dashed #b0b7c3; z-index: 0; }
        .tr-th i { position: absolute; right: 0; top: -7px; font-style: normal; font-size: 9px; color: #9ca3af; background: #fff; padding: 0 2px; line-height: 1.3; }
        .tr-col { flex: 1; display: flex; flex-direction: column; align-items: center; position: relative; z-index: 1; min-width: 0; }
        .tr-barzone { height: 56px; width: 100%; display: flex; align-items: flex-end; justify-content: center; }
        .tr-bar { width: 68%; max-width: 20px; border-radius: 2.5px 2.5px 0 0; }
        .tr-day { font-size: 9px; color: #9ca3af; margin-top: 3px; line-height: 1; }
        .tr-tip { position: fixed; z-index: 9999; background: rgba(17, 24, 39, 0.95); color: #fff; font-size: 11px; font-weight: 600; padding: 5px 10px; border-radius: 7px; pointer-events: none; white-space: nowrap; box-shadow: 0 6px 18px rgba(0, 0, 0, 0.22); transform: translate(-50%, -130%); opacity: 0; transition: opacity 0.1s; }
        .tr-tip.show { opacity: 1; }

        /* ===== 五维经营体检 ===== */
        .five-dim-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; margin-top: 14px; }
        @media (max-width: 1100px) { .five-dim-grid { grid-template-columns: repeat(2, 1fr); } }
        @media (max-width: 640px) { .five-dim-grid { grid-template-columns: 1fr; } }
        .five-dim-card { background: #f8f9fb; border: 1px solid #eef0f4; border-top: 3px solid #e5e7eb; border-radius: 12px; padding: 13px 14px 12px; display: flex; flex-direction: column; }
        .five-dim-card.fd-ok   { border-top-color: #10b981; }
        .five-dim-card.fd-warn { border-top-color: #f59e0b; }
        .five-dim-card.fd-bad  { border-top-color: #ef4444; }
        .five-dim-card.fd-info { border-top-color: #9ca3af; }
        .fd-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 9px; }
        .fd-name { font-size: 13px; font-weight: 700; color: #1a1a2e; display: flex; align-items: center; gap: 5px; }
        .fd-badge { font-size: 10px; padding: 2px 8px; border-radius: 8px; font-weight: 600; white-space: nowrap; }
        .fd-badge.ok   { background: #d1fae5; color: #059669; }
        .fd-badge.warn { background: #fef3c7; color: #d97706; }
        .fd-badge.bad  { background: #fee2e2; color: #dc2626; }
        .fd-badge.info { background: #eef0f4; color: #6b7280; }
        .fd-metrics { margin-bottom: 7px; }
        .fd-metric { display: flex; justify-content: space-between; align-items: baseline; font-size: 12px; padding: 2px 0; }
        .fd-metric .fm-label { color: #8895a7; }
        .fd-metric .fm-value { font-weight: 700; color: #1a1a2e; font-size: 13px; }
        .fd-metric .fm-value.bad { color: #dc2626; }
        .fd-metric .fm-value.warn { color: #d97706; }
        .fd-metric .fm-value.good { color: #059669; }
        .fd-summary { font-size: 11.5px; color: #4b5563; line-height: 1.45; margin-bottom: 8px; }
        .fd-channels { border-top: 1px dashed #e5e7eb; padding-top: 7px; margin-top: auto; }
        .fd-ch { display: flex; justify-content: space-between; align-items: center; font-size: 11px; color: #6b7280; padding: 2px 0; }
        .fd-ch .fch-name { display: flex; align-items: center; gap: 5px; }
        .fd-ch .fch-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex-shrink: 0; }
        .fd-ch .fch-val { font-weight: 600; color: #374151; }
        .fd-ch .fch-val.bad { color: #dc2626; }
        .fd-ch .fch-sub { color: #9ca3af; font-weight: 400; }
        .fd-suggestion { font-size: 11px; color: #d97706; margin-top: 8px; padding-top: 6px; border-top: 1px dashed #e5e7eb; line-height: 1.4; }

        /* ===== L1 decision layer: today's-must-see summary ===== */
        .brief-card { background: white; border-radius: 12px; padding: 20px 22px; box-shadow: 0 1px 4px rgba(0,0,0,0.06); border: 1px solid #eef0f4; margin-bottom: 20px; }
        .brief-head { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
        .brief-head .b-title { font-size: 14px; font-weight: 600; }
        .brief-head .b-fresh { font-size: 11px; padding: 2px 10px; border-radius: 10px; font-weight: 500; }
        .b-fresh.fresh { background: #d1fae5; color: #059669; }
        .b-fresh.stale { background: #fee2e2; color: #dc2626; }
        .brief-conclusion { font-size: 15px; font-weight: 600; color: #1a1a2e; line-height: 1.5; margin-bottom: 14px; padding: 12px 16px; background: #f8f9fb; border-left: 3px solid #4f46e5; border-radius: 0 8px 8px 0; }
        .brief-conclusion .b-emoji { margin-right: 6px; }
        .brief-kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 14px; }
        @media (max-width: 640px) { .brief-kpis { grid-template-columns: 1fr; } }
        .brief-kpi { background: #fafbfc; border: 1px solid #eef0f4; border-radius: 10px; padding: 12px 14px; }
        .brief-kpi .bk-label { font-size: 11px; color: #8895a7; margin-bottom: 4px; }
        .brief-kpi .bk-value { font-size: 20px; font-weight: 700; }
        .brief-kpi .bk-sub { font-size: 11px; margin-top: 2px; }
        .bk-sub.good { color: #10b981; } .bk-sub.bad { color: #ef4444; } .bk-sub.neutral { color: #6b7280; }
        .brief-top3 { margin-top: 4px; }
        .brief-top3 .bt-item { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 8px; cursor: pointer; transition: background 0.12s; }
        .brief-top3 .bt-item:hover { background: #f0f4ff; }
        .brief-top3 .bt-sev { width: 30px; height: 30px; border-radius: 8px; display: inline-flex; align-items: center; justify-content: center; font-size: 13px; flex-shrink: 0; }
        .bt-sev.sev-red { background: #fee2e2; } .bt-sev.sev-ora { background: #fef3c7; } .bt-sev.sev-yel { background: #fef9c3; }
        .brief-top3 .bt-name { flex: 1; font-size: 13px; font-weight: 500; }
        .brief-top3 .bt-reason { font-size: 12px; color: #6b7280; }
        .brief-top3 .bt-action { font-size: 11px; color: #4f46e5; background: #e0e7ff; padding: 3px 9px; border-radius: 8px; white-space: nowrap; }

        /* ===== Alert severity tiers ===== */
        .alert-sev { font-size: 10px; padding: 2px 8px; border-radius: 8px; font-weight: 600; margin-right: 6px; display: inline-flex; align-items: center; justify-content: center; white-space: nowrap; line-height: 1.4; vertical-align: middle; }
        .sev-red { background: #fee2e2; color: #dc2626; }
        .sev-ora { background: #ffedd5; color: #c2410c; }
        .sev-yel { background: #fef9c3; color: #a16207; }
        .alert-action { font-size: 11px; color: #4f46e5; display: block; margin-top: 2px; }
        /* 红黑榜：城市/区域列不折行（删掉责任人/处理两列后仍要保持单行可读） */
        #alertPanelBody table th, #alertPanelBody table td:nth-child(4), #alertPanelBody table td:nth-child(5) { white-space: nowrap; }
        .alert-sec-head { font-size: 12px; font-weight: 600; color: #374151; margin: 12px 0 6px; display: flex; align-items: center; gap: 6px; }
        .collapse-btn { font-size: 12px; color: #4f46e5; cursor: pointer; border: none; background: none; padding: 0; }
        .collapse-btn:hover { text-decoration: underline; }

        /* ===== L3 theme accordion ===== */
        .theme-group { border: 1px solid #eef0f4; border-radius: 10px; margin-bottom: 12px; overflow: hidden; }
        .theme-head { display: flex; align-items: center; gap: 8px; padding: 12px 16px; background: #f8f9fb; cursor: pointer; font-size: 13px; font-weight: 600; color: #374151; user-select: none; }
        .theme-head:hover { background: #f0f2f5; }
        .theme-head .tg-caret { font-size: 11px; color: #8895a7; transition: transform 0.15s; }
        .theme-head .tg-count { margin-left: auto; font-size: 11px; color: #8895a7; font-weight: 400; }
        .theme-body { display: none; padding: 4px; }
        .theme-body.open { display: block; }

        /* ===== metric info tooltip ===== */
        .metric-info { position: relative; display: inline-block; margin-left: 2px; cursor: help; color: #8895a7; font-size: 12px; }
        .metric-info .mi-pop { display: none; position: absolute; left: 0; top: 18px; z-index: 200; background: #1a1a2e; color: #fff; font-size: 11px; padding: 8px 10px; border-radius: 8px; width: 240px; line-height: 1.5; font-weight: 400; }
        .metric-info:hover .mi-pop { display: block; }

        /* ===== 移动端适配（2026-09-17 新增）=====
           .table-scroll 由 wrapScrollableTables() 动态包住每个 <table>，
           使超出卡片宽度的表格在卡片内部横向滚动，而不是撑破整页。 */
        .table-scroll { width: 100%; max-width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch; }
        .table-scroll > table { margin: 0; }
        .table-scroll-hint { display: none; font-size: 11px; color: #9ca3af; text-align: center; margin-top: 6px; }

        @media (max-width: 900px) {
            /* 页头 / 外壳 */
            .header { padding: 14px 16px; }
            .header-content { flex-wrap: wrap; gap: 10px; }
            .header h1 { font-size: 18px; line-height: 1.35; }
            .header .date { font-size: 12px; }
            .container { padding: 14px; }

            /* 指标卡：2 列 */
            .metrics-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
            .metric-card { padding: 12px 13px; border-radius: 10px; }
            .metric-card .value { font-size: 19px; }
            .metric-card .label { font-size: 11px; }

            /* 卡片内边距收紧 */
            .table-card, .chart-card, .store-detail-card, .trend-card, .info-panel, .brief-card { padding: 14px 13px; border-radius: 10px; }
            .chart-container { height: 230px; }
            .trend-container { height: 250px; }

            /* 表格：字号缩小 + 允许在卡片内横向滚动 */
            table { font-size: 12px; }
            thead th, tbody td { padding: 8px 9px; }
            /* 表头/单元格不换行 → 列宽跟随内容，避免中文被压成竖排 */
            .table-scroll > table thead th { white-space: nowrap; }
            .table-scroll > table tbody td { white-space: nowrap; }
            .table-scroll > table { width: auto; min-width: 100%; }
            .table-scroll > table:has(#storeTableBody) { min-width: 1040px; }
            .table-scroll-hint { display: block; }

            .brief-conclusion { font-size: 14px; padding: 10px 12px; }
            .fd-summary, .fd-suggestion { font-size: 11px; }
        }

        @media (max-width: 560px) {
            .container { padding: 10px; }
            .header h1 { font-size: 16px; }
            .header .badge { font-size: 12px; padding: 5px 11px; }
            .metrics-grid { gap: 8px; }
            .metric-card .value { font-size: 17px; }
            .chart-container { height: 210px; }
            .trend-container { height: 230px; }

                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');

        function jsStr(v) {

        function shortStoreName(name) {

            // 各种前缀变体导致的店名过长、显示不全问题。
            const m = raw.match(/[（(]([^（）()]*)[）)]\s*$/);
            if (m && m[1] && m[1].trim()) return m[1].trim();
            // 兜底：无括号时按多种前缀写法去除品牌前缀。
            const clean = raw
                .replace(/^PJ[\s　]*Panda[\s　]*JOJO[\s　]*快时尚美甲[\s　]*/i, '')
                .replace(/^PJ[\s　]*Panda[\s　]*JOJO[\s　]*/i, '')

                .replace(/^快时尚美甲[\s　]*/i, '');
            const short = clean.replace(/^[（(]/, '').replace(/[）)]$/, '');

        }

        // Data loaded via inline script tags

        // 诊断族载荷（STORE_DIAGNOSIS / TREND / JOURNEY / COMPARISON / SLOT_DETAIL / DAILY_WINDOW）
        // 本模板未接入，applyPeriod 不切换它们。
        window.__MAIN_PERIOD = window.__MAIN_PERIOD || {

        };
        const PERIOD_ORDER = (window.PERIOD_ORDER && window.PERIOD_ORDER.length)

        const DEFAULT_PERIOD = window.DEFAULT_PERIOD || (PERIOD_ORDER[0] || '');

        const PERIOD_EXTRA = window.PERIOD_EXTRA || {};

        // 可分享状态：最小实现只保证 month（及兼容 view）；其余导航仍走原 currentLevel/path。
        const STATE = { view: 'home', month: DEFAULT_PERIOD };

        function stateHash(s) {
            const st = s || STATE;
            const parts = [];
            parts.push('view=' + encodeURIComponent(st.view || 'home'));
            if (st.month) parts.push('month=' + encodeURIComponent(st.month));
            return '#/' + parts.join('&');
        }

        function parseHash() {
            const raw = (location.hash || '').replace(/^#\/?/, '');
            const out = {};
            if (!raw) return out;
            raw.split('&').forEach(function (pair) {
                const i = pair.indexOf('=');
                if (i < 0) return;
                const k = decodeURIComponent(pair.slice(0, i));
                const v = decodeURIComponent(pair.slice(i + 1));
                if (k) out[k] = v;
            });
            return out;
        }

        function link(patch) {
            if (patch && typeof patch === 'object') {

                    } else {
                        STATE[k] = patch[k];
                    }
                });
            }
            if (!STATE.view) STATE.view = 'home';
            if (!STATE.month) STATE.month = DEFAULT_PERIOD;

        // Initialize the header timestamp dynamically from the loaded data

        // 避免把月中数据（如 10 月只到 20 日）误读为整月，进而误判为业绩暴跌。
        function periodLabel(month) {
            if (!month) return '';
            let cur = '';
            try {
                cur = new Date().toLocaleDateString('en-CA', { timeZone: 'Asia/Shanghai' }).slice(0, 7);

            return (cur && month === cur) ? (month + '（本月至今 MTD，非整月）') : month;

        // BI 数据为 T-1（业务确认）：数据截止日 = 拉取日 - 1 天。

        function dataCutoffSuffix() {

        function changeDate(delta) { const dates = DAILY.dates || []; let idx = dates.indexOf(selectedDate); idx += delta; if (idx < 0) idx = 0; if (idx >= dates.length) idx = dates.length - 1; onDateChange(dates[idx]); }

        // ===== Daily trend chart =====
        function renderDailyTrend(container) {

        // ===== 移动端：把每个 <table> 包进 .table-scroll，超宽时在卡片内横向滚动 =====
        function wrapScrollableTables() {
            const host = document.getElementById('dynamicContent');
            if (!host) return;
            host.querySelectorAll('table').forEach(function (tbl) {
                const p = tbl.parentElement;
                if (!p || p.classList.contains('table-scroll')) return;
                const box = document.createElement('div');
                box.className = 'table-scroll';
                p.insertBefore(box, tbl);
                box.appendChild(tbl);
            });
            // 表格确实溢出时，补一行「左右滑动」提示（桌面端 CSS 默认隐藏）
            host.querySelectorAll('.table-scroll').forEach(function (box) {
                const card = box.parentElement;
                if (!card) return;
                const old = card.querySelector(':scope > .table-scroll-hint');
                if (box.scrollWidth > box.clientWidth + 2) {
                    if (!old) {
                        const hint = document.createElement('div');
                        hint.className = 'table-scroll-hint';
                        hint.textContent = '← 左右滑动查看全部列 →';
                        card.appendChild(hint);
                    }
                } else if (old) {
                    old.remove();
                }
            });
        }

        // ===== 五维经营体检：访问 → 转化 → 核销 → 承接 → 复购 =====
        // 无副作用地收集当前数据源下的全部门店（不动 _storeIndex）。
        function getAllStoresNoIndex() {
            const src = getCurrentData();
            const all = [];
            Object.values(src.cities || {}).forEach(c => {
                Object.values(c.districts || {}).forEach(d => {
                    (d.stores || []).forEach(s => all.push(s));
                });
            });

        // 生成五维体检 HTML：从五个经营环节逐一诊断一家门店。
        function renderFiveDimPanel(store) {
            const m = store.metrics || {};
            const ch = store.channels || {};
            const t = ALERT_THRESHOLDS;
            const isDaily = appMode === 'daily';
            const chNames = Object.keys(ch).sort((a, b) => (ch[b].gmv || 0) - (ch[a].gmv || 0));

            // 连锁基准（用于相对判断：转化率、人效）
            const all = getAllStoresNoIndex();
            const avgOf = (k) => all.length ? all.reduce((a, s) => a + (s.metrics[k] || 0), 0) / all.length : 0;
            const benchConv = avgOf('conversion_rate');
            const benchEff = avgOf('efficiency');
            const chSum = (key) => chNames.reduce((a, n) => a + (ch[n][key] || 0), 0);
            const conversions = chSum('conversions');

            const dims = [];

            // ---- 1. 访问（流量）----
            (function () {
                const vMom = m.visitors_mom || 0;
                let st = 'ok', lb = '健康', sum = '流量平稳，无异常波动';
                if (vMom < -20) { st = 'bad'; lb = '异常'; sum = '流量大幅下滑，需排查曝光与投放'; }
                else if (vMom < -10) { st = 'warn'; lb = '关注'; sum = '流量小幅下滑，警惕趋势延续'; }
                else if (vMom > 30) { st = 'warn'; lb = '关注'; sum = '流量激增，需确认承接能力是否跟得上'; }
                const chs = chNames.map(n => {
                    const v = ch[n].visitors || 0;
                    return { n, val: fmtNum(v), sub: m.visitors ? '占' + (v / m.visitors * 100).toFixed(0) + '%' : '', bad: false };
                });
                dims.push({ key: 'traffic', icon: '👁️', name: '访问', st, lb, sum,
                    metrics: [['访问人数', fmtNum(m.visitors), ''], ['环比', fmtPctSigned(vMom), vMom < 0 ? 'bad' : 'good']],
                    channels: chs,
                    tip: vMom < -10 ? '复盘各渠道曝光预算，找回流量' : '' });
            })();

            // ---- 2. 转化 ----
            (function () {
                const cv = m.conversion_rate || 0;
                let st = 'ok', lb = '健康', sum = '转化率正常';
                if (cv < 8) { st = 'bad'; lb = '异常'; sum = '转化率过低，下单环节严重流失'; }
                else if (cv < (benchConv * 0.8 || 12)) { st = 'warn'; lb = '关注'; sum = '转化率低于连锁均值，可优化'; }
                const chs = chNames.map(n => ({ n, val: fmtPct(ch[n].conversion_rate), sub: '成交' + fmtNum(ch[n].conversions), bad: (ch[n].conversion_rate || 0) < 8 }));
                dims.push({ key: 'conversion', icon: '🎯', name: '转化', st, lb, sum,
                    metrics: [['转化率', fmtPct(cv), cv < 8 ? 'bad' : 'good'], ['成交人数', fmtNum(conversions), '']],
                    channels: chs,
                    tip: cv < 12 ? '优化团购详情/定价，提升下单转化' : '' });
            })();

            // ---- 3. 核销 ----
            (function () {
                const vr = m.verify_rate || 0;
                let st = 'ok', lb = '健康', sum = '核销正常，履约质量良好';
                if (vr < t.verifyMin) { st = 'bad'; lb = '异常'; sum = '核销率过低，大量已购未到店'; }
                else if (vr < 60) { st = 'warn'; lb = '关注'; sum = '核销率偏低，需跟进未核销用户'; }
                const chs = chNames.map(n => ({ n, val: fmtPct(ch[n].verify_rate), sub: '核销' + fmtNum(ch[n].verified), bad: (ch[n].verify_rate || 0) < 50 }));
                dims.push({ key: 'verify', icon: '🧾', name: '核销', st, lb, sum,
                    metrics: [['核销率', fmtPct(vr), vr < 50 ? 'bad' : 'good'], ['核销人数', fmtNum(m.verified), '']],
                    channels: chs,
                    tip: vr < 60 ? '跟进已购未核销用户，优化预约到店链路' : '' });
            })();

            // ---- 4. 承接（到店履约）----
            (function () {
                const suc = m.success_queue_rate || 0;   // 取号核销率
                const can = m.cancel_queue_rate || 0;    // 取号取消率
                const eff = m.efficiency || 0;           // 美甲师人效
                const sat = m.saturation || 0;           // 工位饱和率
                const flags = [];
                if (can > t.queueCancelMin) flags.push(['bad', '取号取消率' + fmtPct(can)]);
                else if (can > 20) flags.push(['warn', '取号取消率' + fmtPct(can)]);
                if (suc > 0 && suc < 60) flags.push(['bad', '取号核销率' + fmtPct(suc)]);
                else if (suc > 0 && suc < 70) flags.push(['warn', '取号核销率' + fmtPct(suc)]);
                if (sat > 0 && sat < 50) flags.push(['warn', '工位空置过半，人手不足（饱和率' + fmtPct(sat) + '）']);
                if (eff > 0 && benchEff > 0 && eff < benchEff * 0.7) flags.push(['warn', '人效偏低 ¥' + Math.round(eff)]);
                let st = 'ok', lb = '健康', sum = '到店承接顺畅，无排队/人手问题';
                if (flags.some(f => f[0] === 'bad')) { st = 'bad'; lb = '异常'; sum = flags.filter(f => f[0] === 'bad').map(f => f[1]).join('、'); }
                else if (flags.length) { st = 'warn'; lb = '关注'; sum = flags.map(f => f[1]).join('、'); }
                const tipParts = [];
                if (sat > 0 && sat < 50) tipParts.push('招美甲师补人力');
                if (can > t.queueCancelMin) tipParts.push('优化排队叫号体验');
                dims.push({ key: 'fulfill', icon: '🏪', name: '承接', st, lb, sum,
                    metrics: [['取号核销', fmtPct(suc), (suc > 0 && suc < 60) ? 'bad' : 'good'],
                              ['取号取消', fmtPct(can), can > 30 ? 'bad' : 'good'],
                              ['人效', '¥' + Math.round(eff), ''],
                              ['饱和率', fmtPct(sat), (sat > 0 && sat < 50) ? 'warn' : 'good']],
                    channels: null,
                    tip: tipParts.join('；') });
            })();

            // ---- 5. 复购 ----
            (function () {
                if (isDaily) {
                    dims.push({ key: 'repurchase', icon: '🔁', name: '复购', st: 'info', lb: '月度', sum: '复购为月度指标，日度口径暂不统计',
                        metrics: [['新客人数', fmtNum(m.new_customers), ''], ['新客占比', m.verified ? fmtPct(m.new_customers / m.verified * 100) : '—', '']],
                        channels: null, tip: '切换月度模式查看复购率' });
                    return;
                }
                const rp = m.repurchase || 0;
                const newRatio = m.verified ? (m.new_customers || 0) / m.verified * 100 : 0;
                let st = 'ok', lb = '健康', sum = '复购正常，老客留存健康';
                if (rp < 10) { st = 'bad'; lb = '异常'; sum = '复购率过低，几乎全靠新客'; }
                else if (rp < 15) { st = 'warn'; lb = '关注'; sum = '复购率偏低，老客留存不足'; }
                dims.push({ key: 'repurchase', icon: '🔁', name: '复购', st, lb, sum,
                    metrics: [['复购率', fmtPct(rp), rp < 10 ? 'bad' : (rp < 15 ? 'warn' : 'good')], ['新客占比', fmtPct(newRatio), '']],
                    channels: null,
                    tip: rp < 15 ? '沉淀会员、离店召回，提升老客回头率' : '' });
            })();

            const badge = { ok: ['ok', '健康'], warn: ['warn', '关注'], bad: ['bad', '异常'], info: ['info', '月度'] };
            const cards = dims.map(d => {
                const bc = badge[d.st] || badge.ok;
                const chHtml = (d.channels && d.channels.length) ? `
                    <div class="fd-channels">
                        ${d.channels.map(c => `
                            <div class="fd-ch">
                                <span class="fch-name"><span class="fch-dot" style="background:${CHANNEL_COLORS[c.n] || '#6b7280'}"></span>${esc(c.n)}</span>
                                <span class="fch-val ${c.bad ? 'bad' : ''}">${c.val}${c.sub ? ' <span class="fch-sub">' + c.sub + '</span>' : ''}</span>
                            </div>`).join('')}
                    </div>` : '';
                const tipHtml = d.tip ? `<div class="fd-suggestion">💡 ${esc(d.tip)}</div>` : '';
                return `
                    <div class="five-dim-card fd-${d.st}">
                        <div class="fd-head">
                            <span class="fd-name">${d.icon} ${d.name}</span>
                            <span class="fd-badge ${bc[0]}">${bc[1]}</span>
                        </div>
                        <div class="fd-metrics">
                            ${d.metrics.map(mt => `<div class="fd-metric"><span class="fm-label">${mt[0]}</span><span class="fm-value ${mt[2] || ''}">${mt[1]}</span></div>`).join('')}
                        </div>
                        <div class="fd-summary">${esc(d.sum)}</div>
                        ${chHtml}
                        ${tipHtml}
                    </div>`;
            }).join('');

            return `
                <div class="table-card" style="margin-bottom:12px">
                    <h3>🩺 五维经营体检 <span class="tag">访问 → 转化 → 核销 → 承接 → 复购</span></h3>
                    <div class="five-dim-grid">${cards}</div>
                    <div class="chart-hint" style="text-align:left;margin-top:10px">🏷️ 健康=绿 · 关注=黄 · 异常=红；「访问/转化/核销」含渠道下钻，「承接/复购」为门店级承接与服务指标。</div>
                </div>`;
        }

        // ===== 渠道归因诊断：定位问题渠道 =====
        // 返回命中预警的问题渠道（按问题数、GMV 降序），用于门店诊断的「渠道归因」。
        function diagnoseStoreChannel(store) {
            const ch = store.channels || {};
            const t = ALERT_THRESHOLDS;
            const bad = [];
            Object.keys(ch).forEach(name => {
                const c = ch[name];
                const probs = [];
                if ((c.refund_rate || 0) > t.refundMax) probs.push('退款' + fmtPct(c.refund_rate));
                if ((c.verify_rate || 0) < t.verifyMin && (c.gmv || 0) > 0) probs.push('核销' + fmtPct(c.verify_rate));
                if ((c.gmv_mom || 0) < t.momDropMin) probs.push('环比' + fmtPctSigned(c.gmv_mom));
                if (probs.length) bad.push({ name, probs, gmv: c.gmv || 0 });
            });
            bad.sort((a, b) => (b.probs.length - a.probs.length) || (b.gmv - a.gmv));
            return bad;
        }

        // 生成渠道归因诊断文案：有问题渠道→点出渠道；无渠道问题但有产能/排队→说明非渠道原因。
        function renderChannelDiagHtml(chDiag, hits) {
            if (chDiag && chDiag.length > 0) {
                const main = chDiag[0];
                const rest = chDiag.slice(1).map(o => '<b>' + o.name + '</b>（' + o.probs.join('、') + '）').join('；');
                return `<div class="chart-hint" style="text-align:left;margin-top:10px;background:#fff7ed;border:1px solid #fed7aa;padding:10px 12px;border-radius:8px">
                    🔍 渠道归因：问题集中在 <b>${main.name}</b>（${main.probs.join('、')}）${rest ? '；' + rest : ''}，其余渠道基本正常。
                </div>`;
            }
            const nonCh = (hits || []).filter(h => h.key === 'capacity' || h.key === 'queue');
            if (nonCh.length > 0) {
                return `<div class="chart-hint" style="text-align:left;margin-top:10px;background:#eef2ff;border:1px solid #c7d2fe;padding:10px 12px;border-radius:8px">
                    🔍 渠道归因：三个渠道指标均正常，本店问题为「${nonCh.map(h => h.tag).join('、')}」，与渠道无关（属产能/排队承接问题）。
                </div>`;
            }
            return '';
        }

        // ===== 渠道逐日趋势：判断问题渠道是"每天都这样"还是"单日波动" =====
        // 从全局 DAILY 数据提取某门店某渠道的逐日核销率/退款率序列。
        function getDailyChannelSeries(storeId, channelName) {
            if (!DAILY || !DAILY.dates || !DAILY.daily) return null;
            const series = { dates: [], verify: [], refund: [] };
            DAILY.dates.forEach(date => {
                const day = DAILY.daily[date];
                let ch = null;
                if (day && day.cities) {
                    outer:
                    for (const c of Object.values(day.cities)) {
                        for (const d of Object.values(c.districts || {})) {
                            const st = (d.stores || []).find(s => s.id === storeId);
                            if (st) { ch = (st.channels || {})[channelName] || null; break outer; }
                        }
                    }
                }
                series.dates.push(date);
                series.verify.push(ch ? (ch.verify_rate || 0) : null);
                series.refund.push(ch ? (ch.refund_rate || 0) : null);
            });
            return series;
        }

        // 判断一串值相对阈值是"持续"还是"偶发"。direction: 'low'=低于阈值算超标, 'high'=高于阈值算超标。
        function trendVerdict(values, threshold, direction) {
            const valid = values.filter(v => v !== null && v !== undefined);
            if (valid.length < 3) return null;
            const bad = valid.filter(v => (direction === 'low' ? v < threshold : v > threshold)).length;
            const persistent = bad >= Math.ceil(valid.length * 0.6);
            return { bad, total: valid.length, persistent, min: Math.min(...valid), max: Math.max(...valid) };
        }

        // 生成问题渠道的逐日趋势区块：每个渠道一张卡，核销率 / 退款率左右两栏 CSS 柱状图。
        // 柱高 = 当日值（0~100 截断）；虚线 = 达标线；深色柱 = 超标日，浅色柱 = 正常日。
        function renderChannelTrends(store) {
            if (!DAILY || !DAILY.dates || !DAILY.daily) return '';
            const diag = diagnoseStoreChannel(store);
            if (!diag || diag.length === 0) return '';
            const t = ALERT_THRESHOLDS;
            const days = DAILY.dates.map(d => d.slice(5).replace('-', '.'));
            const n = DAILY.dates.length;

            // 单指标柱状图（含达标虚线）
            const barsHtml = (values, threshold, direction, badColor, okColor) =>
                '<div class="tr-bars">' +
                '<div class="tr-th" style="bottom:calc(13px + ' + (56 * threshold / 100).toFixed(1) + 'px)"><i>' + threshold + '%</i></div>' +
                values.map((v, i) => {
                    const day = '<span class="tr-day">' + days[i] + '</span>';
                    if (v === null || v === undefined) return '<div class="tr-col"><div class="tr-barzone"></div>' + day + '</div>';
                    const isBad = direction === 'low' ? v < threshold : v > threshold;
                    const h = Math.max(4, Math.min(v, 100));
                    return '<div class="tr-col" data-tip="' + days[i] + '：' + v.toFixed(1) + '%">' +
                        '<div class="tr-barzone"><div class="tr-bar" style="height:' + h + '%;background:' + (isBad ? badColor : okColor) + '"></div></div>' +
                        day + '</div>';
                }).join('') + '</div>';

            // 单指标块：标题（名 + 徽章）+ 说明 + 柱状图
            const metricHtml = (name, values, threshold, direction, kind) => {
                const vd = trendVerdict(values, threshold, direction);
                if (!vd) return '';
                let badge, bStyle;
                if (vd.bad === 0) { badge = '全部达标'; bStyle = 'background:#d1fae5;color:#059669'; }
                else if (vd.persistent) { badge = '持续' + (kind === 'verify' ? '偏低' : '偏高'); bStyle = 'background:#fee2e2;color:#dc2626'; }
                else { badge = '单日波动'; bStyle = 'background:#fef3c7;color:#d97706'; }
                const sub = vd.bad === 0
                    ? '近' + vd.total + '天均未破线 · ' + vd.min.toFixed(0) + '%~' + vd.max.toFixed(0) + '%'
                    : vd.bad + '/' + vd.total + '天' + (kind === 'verify' ? '低于' : '高于') + threshold + '% · ' + vd.min.toFixed(0) + '%~' + vd.max.toFixed(0) + '%';
                const colors = kind === 'verify' ? ['#7c3aed', '#ddd6fe'] : ['#dc2626', '#fecaca'];
                return '<div class="tr-metric">' +
                    '<div class="tr-meta">' +
                        '<div class="tr-m-head"><span class="tr-m-name">' + name + '</span><span class="tr-badge" style="' + bStyle + '">' + badge + '</span></div>' +
                        '<div class="tr-m-sub">' + sub + '</div>' +
                    '</div>' +
                    barsHtml(values, threshold, direction, colors[0], colors[1]) + '</div>';
            };

            const cards = diag.map(o => {
                const series = getDailyChannelSeries(store.id, o.name);
                if (!series) return '';
                const vm = metricHtml('核销率', series.verify, t.verifyMin, 'low', 'verify');
                const rm = metricHtml('退款率', series.refund, t.refundMax, 'high', 'refund');
                if (!vm && !rm) return '';
                return '<div class="tr-ch"><div class="tr-ch-head">' + esc(o.name) + '</div>' + vm + rm + '</div>';
            }).join('');
            if (!cards) return '';
            return '<div class="tr-card">' +
                '<div style="font-size:13px;font-weight:700;color:#111827">📈 逐日趋势（近' + n + '天）</div>' + cards +
                '<div style="margin-top:8px;font-size:11px;color:#8895a7">虚线为达标线（核销' + t.verifyMin + '% / 退款' + t.refundMax + '%），深色柱=超标日 —— 看问题是「每天都这样」还是「单日突变」</div>' +
                '</div>';
        }

        // ===== 门店端经营分析（针对单门店的诊断）=====
        function renderStoreBusinessAnalysis(store) {
            const el = document.getElementById('storeBizAnalysis');
            if (!el) return;
            const m = store.metrics || {};
            const ch = store.channels || {};
            const chKeys = Object.keys(ch);

            // 1) 门店预警扫描（复用全局预警规则引擎）
            const alerts = scanStoreAlerts([store]);
            const hits = alerts.length > 0 ? alerts[0].hits : [];

            // 2) 单店经营漏斗
            const t = computeFunnelTotals([store]);

            // 3) 渠道质量（单店各渠道核销率 / 退款率）
            const chRows = chKeys.map(name => {
                const c = ch[name];
                const verifyRate = (c.gmv || 0) > 0 ? (c.gtv || 0) / c.gmv * 100 : 0;
                const refundRate = (c.refund_rate || 0);
                return { name, c, verifyRate, refundRate };
            }).sort((a, b) => b.c.gmv - a.c.gmv);

            const starHtml = (store.star_level || 0) > 0
                ? `<div class="store-info-item"><div class="si-label">平台星级</div><div class="si-value" style="color:#d97706;font-weight:700">${(store.star_level || 0).toFixed(1)} 分</div></div>`
                : '';
            const scoreHtml = (store.operation_score || 0) > 0
                ? `<div class="store-info-item"><div class="si-label">经营分</div><div class="si-value" style="color:${(store.operation_score || 0) >= 80 ? '#16a34a' : (store.operation_score || 0) >= 60 ? '#d97706' : '#dc2626'};font-weight:700">${store.operation_score}</div></div>`
                : '';

            // 预警诊断区
            let alertHtml;
            if (hits.length === 0) {
                const chDiag0 = diagnoseStoreChannel(store);
                if (chDiag0.length > 0) {
                    alertHtml = `<div class="summary-chip alert-ok" style="display:inline-block">✅ 整店指标正常，但个别渠道有隐患</div>` + renderChannelDiagHtml(chDiag0, []);
                } else {
                    alertHtml = `<div class="summary-chip alert-ok" style="display:inline-block">✅ 本店当前各项指标正常，无预警</div>`;
                }
            } else {
                const alertObj = alerts[0];
                const sevMeta = SEV_META[severityTier(alertObj)];
                const actions = actionForStore(hits);
                alertHtml = `
                    <div class="summary-chips">
                        <span class="alert-sev ${sevMeta.cls}">风险等级：${sevMeta.label}</span>
                        ${hits.map(h => `<div class="summary-chip danger">${h.tag} · ${h.detail(m)}</div>`).join('')}
                    </div>
                    ${renderChannelDiagHtml(diagnoseStoreChannel(store), hits)}
                    ${actions.length ? `<div class="chart-hint" style="text-align:left">💡 建议动作：${actions.join('；')}</div>` : ''}`;
            }

            // 核心指标卡（左栏）：进店转化率 / 到店核销率 / 取号取消率 / 人效 / 饱和率 / 退款率 / 星级 / 经营分
            const infoGridHtml = `<div class="store-info-grid">
                <div class="store-info-item"><div class="si-label">进店转化率</div><div class="si-value" style="color:${m.conversion_rate < 10 ? '#dc2626' : '#374151'}">${fmtPct(m.conversion_rate)}</div></div>
                <div class="store-info-item"><div class="si-label">到店核销率</div><div class="si-value" style="color:${m.verify_rate < 50 ? '#dc2626' : '#374151'}">${fmtPct(m.verify_rate)}</div></div>
                <div class="store-info-item"><div class="si-label">取号取消率</div><div class="si-value" style="color:${m.cancel_queue_rate > 30 ? '#dc2626' : '#374151'}">${fmtPct(m.cancel_queue_rate)}</div></div>
                <div class="store-info-item"><div class="si-label">美甲师人效</div><div class="si-value">¥${Math.round(m.efficiency || 0)}/日</div></div>
                <div class="store-info-item"><div class="si-label">工位饱和率</div><div class="si-value">${fmtPct(m.saturation)}</div></div>
                <div class="store-info-item"><div class="si-label">退款率</div><div class="si-value" style="color:${m.refund_rate > 35 ? '#dc2626' : '#374151'}">${fmtPct(m.refund_rate)}</div></div>
                ${starHtml}
                ${scoreHtml}
            </div>`;

            const channelTrends = renderChannelTrends(store);

            el.innerHTML = `
                ${renderFiveDimPanel(store)}
                <div class="table-card" style="margin-bottom:12px">
                    <h3>🩺 门店经营诊断 <span class="tag">预警 · 漏斗 · 渠道 · 产能</span></h3>
                    <div style="margin-bottom:12px">${alertHtml}</div>
                    ${channelTrends
                        ? `<div class="diag-split">
                            <div class="diag-left">${infoGridHtml}</div>
                            <div class="diag-right">${channelTrends}</div>
                        </div>`
                        : `<div style="margin-bottom:14px">${infoGridHtml}</div>`}
                </div>

                <div class="panel-grid" style="margin-bottom:12px">
                    <div class="chart-card">
                        <h3>🌀 本店经营漏斗 <span class="tag">曝光 → 转化 → 核销</span></h3>
                        ${t.visitors === 0 ? '<div class="chart-hint">无数据</div>' : `
                            <div style="display:flex;flex-direction:column;gap:6px;margin-top:8px">
                                <div class="funnel-stage" style="width:100%;background:linear-gradient(90deg,#6366f1,#818cf8)">
                                    <div class="fs-label">曝光 · 线上访问</div><div class="fs-value">${fmtNum(t.visitors)}</div>
                                </div>
                                <div class="funnel-rate" style="text-align:center"><span class="arrow">↓</span>进店转化率 <b>${fmtPct(t.conversion_rate)}</b><span class="arrow">↓</span></div>
                                <div class="funnel-stage" style="width:${Math.max(t.conversions / t.visitors * 100, 12)}%;background:linear-gradient(90deg,#4f46e5,#7c6ee6)">
                                    <div class="fs-label">转化 · 线上成交</div><div class="fs-value">${fmtNum(t.conversions)}</div>
                                </div>
                                <div class="funnel-rate" style="text-align:center"><span class="arrow">↓</span>到店核销率 <b>${fmtPct(t.verify_rate)}</b><span class="arrow">↓</span></div>
                                <div class="funnel-stage" style="width:${Math.max(t.verified / t.visitors * 100, 38)}%;background:linear-gradient(90deg,#16a34a,#22b573)">
                                    <div class="fs-label">核销 · 到店消费</div>
                                    <div class="fs-value">${fmtNum(t.verified)} 人</div>
                                    <div class="fs-sub">GTV ${fmtMoney(t.gtv)} · 人均 ¥${Math.round(t.aov)}</div>
                                </div>
                            </div>`}
                    </div>
                    <div class="chart-card">
                        <h3>🔍 本店渠道质量 <span class="tag">各渠道核销/退款</span></h3>
                        ${chRows.length === 0 ? '<div class="chart-hint">无渠道数据</div>' : `
                            <table style="margin-top:8px">
                                <thead><tr><th>渠道</th><th>GMV</th><th>GTV</th><th>核销率</th><th>退款率</th></tr></thead>
                                <tbody>
                                    ${chRows.map(r => `
                                        <tr>
                                            <td style="font-weight:600"><span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:${CHANNEL_COLORS[r.name] || '#6b7280'};margin-right:6px;vertical-align:-1px"></span>${esc(r.name)}</td>
                                            <td style="font-weight:600">${fmtMoney(r.c.gmv)}</td>
                                            <td>${fmtMoney(r.c.gtv)}</td>
                                            <td style="color:${r.verifyRate < 60 ? '#dc2626' : '#374151'};font-weight:${r.verifyRate < 60 ? 700 : 500}">${fmtPct(r.verifyRate)}</td>
                                            <td style="color:${r.refundRate > 35 ? '#dc2626' : '#374151'}">${fmtPct(r.refundRate)}</td>
                                        </tr>`).join('')}
                                </tbody>
                            </table>
                            <div class="chart-hint" style="text-align:left">核销率 = 核销GTV / GMV；退款率按 GMV 加权</div>`}
                    </div>
                    <div class="chart-card">
                        <h3>👁️ 本店访问分析 <span class="tag">访问量 · 环比 · 渠道构成</span></h3>
                        ${(() => {
                            const vis = m.visitors || 0;
                            const mom = m.visitors_mom || 0;
                            const chs = Object.entries(ch).filter(([name]) => name !== '小程序');
                            const chVisSum = chs.reduce((a, [, c]) => a + (c.visitors || 0), 0);
                            return vis === 0 ? '<div class="chart-hint">无访问数据</div>' : `
                            <div class="store-info-grid" style="grid-template-columns:repeat(3,1fr);margin-bottom:10px">
                                <div class="store-info-item"><div class="si-label">线上访问人数</div><div class="si-value" style="color:#4f46e5">${fmtNum(vis)}</div></div>
                                <div class="store-info-item"><div class="si-label">访问环比</div><div class="si-value" style="color:${mom >= 0 ? '#dc2626' : '#16a34a'}">${fmtPctSigned(mom)}</div></div>
                                <div class="store-info-item"><div class="si-label">进店转化率</div><div class="si-value" style="color:${m.conversion_rate < 10 ? '#dc2626' : '#374151'}">${fmtPct(m.conversion_rate)}</div></div>
                            </div>
                            <table style="margin-top:8px">
                                <thead><tr><th>渠道</th><th>访问量</th><th>访问占比</th><th>转化数</th><th>转化率</th></tr></thead>
                                <tbody>
                                    ${chs.map(([name, c]) => {
                                        const cv = c.visitors || 0;
                                        const p = chVisSum > 0 ? cv / chVisSum * 100 : 0;
                                        const convRate = cv > 0 ? (c.conversions || 0) / cv * 100 : 0;
                                        return `
                                        <tr>
                                            <td style="font-weight:600"><span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:${CHANNEL_COLORS[name] || '#6b7280'};margin-right:6px;vertical-align:-1px"></span>${esc(name)}</td>
                                            <td style="font-weight:600;color:#4f46e5">${fmtNum(cv)}</td>
                                            <td>
                                                <div style="display:flex;align-items:center;gap:8px">
                                                    <span style="min-width:44px">${fmtPct(p)}</span>
                                                    <div class="quality-bar" style="flex:1"><span style="width:${p.toFixed(1)}%;background:${CHANNEL_COLORS[name] || '#6b7280'}"></span></div>
                                                </div>
                                            </td>
                                            <td>${fmtNum(c.conversions || 0)}</td>
                                            <td style="color:${convRate < 10 ? '#dc2626' : '#374151'}">${fmtPct(convRate)}</td>
                                        </tr>`;
                                    }).join('')}
                                </tbody>
                            </table>
                            <div class="chart-hint" style="text-align:left">访问占比 = 该渠道访问量 ÷ 本店总访问量 · 转化率 = 转化数 ÷ 访问量</div>`;
                        })()}
                    </div>
                </div>
            `;
        }

        // Breadcrumb
        function renderBreadcrumb() {
            const bc = document.getElementById('breadcrumb');
            if (appMode === 'daily' && DAILY && DAILY.dates) {
                // Daily mode: show date tabs (e.g. 9.12 9.11 9.10...)
                const dates = DAILY.dates;
                let dateTabs = '';
                // Show dates in reverse order (latest first)
                for (let i = dates.length - 1; i >= 0; i--) {
                    const d = dates[i];
                    const isActive = d === selectedDate;
                    const short = d.slice(5).replace('-', '.'); // "09-12" -> "9.12"
                    dateTabs += `<div class="breadcrumb-item ${isActive?'active':''}" onclick="onDateChange('${d}')">${short}</div>`;
                }
                let html = dateTabs;
                if (currentLevel >= 1) {
                    html += `<span class="breadcrumb-sep">›</span>`;
                    html += `<div class="breadcrumb-item ${currentLevel===1?'active':''}" onclick="navigateTo(1)">${currentPath.city}</div>`;
                }
                if (currentLevel >= 2) {
                    html += `<span class="breadcrumb-sep">›</span>`;
                    html += `<div class="breadcrumb-item ${currentLevel===2?'active':''}" onclick="navigateTo(2)">${currentPath.district}</div>`;
                }
                if (currentLevel >= 3) {
                    html += `<span class="breadcrumb-sep">›</span>`;
                    html += `<div class="breadcrumb-item active">门店详情</div>`;
                }
                bc.innerHTML = html;
                return;
            }
            // Monthly mode: original breadcrumb
            let html = `<div class="breadcrumb-item ${currentLevel===0?'active':''}" onclick="navigateTo(0)">📊 全部</div>`;
            if (currentLevel >= 1) {
                html += `<span class="breadcrumb-sep">›</span>`;
                html += `<div class="breadcrumb-item ${currentLevel===1?'active':''}" onclick="navigateTo(1)">${currentPath.city}</div>`;
            }
            if (currentLevel >= 2) {
                html += `<span class="breadcrumb-sep">›</span>`;
                html += `<div class="breadcrumb-item ${currentLevel===2?'active':''}" onclick="navigateTo(2)">${currentPath.district}</div>`;
            }
            if (currentLevel >= 3) {
                html += `<span class="breadcrumb-sep">›</span>`;
                html += `<div class="breadcrumb-item active">门店详情</div>`;
            }
            bc.innerHTML = html;
        }

                { icon:'🎯', bg:'#fce7f3', fg:'#db2777', label:'转化率', value: fmtPct(summary.conversion_rate), change: '加权平均', cls: 'neutral', info: info('conversion') },

        // Channel doughnut chart (supports gmv / verified metric toggle)
        function renderChannelChart(canvasId, channels, metric) {
            metric = metric || 'gmv';
            const labels = Object.keys(channels);
            const data = metric === 'gmv'
                ? labels.map(l => channels[l].gmv)
                : labels.map(l => channels[l].verified);
            const total = data.reduce((a, b) => a + b, 0);
            const colors = labels.map(l => CHANNEL_COLORS[l] || '#6b7280');
            const legendLabels = labels.map((l, i) => {
                const pct = total > 0 ? (data[i] / total * 100).toFixed(1) : '0.0';
                return l + ' ' + pct + '%';
            });

            charts.push(new Chart(document.getElementById(canvasId), {
                type: 'doughnut',
                data: { labels: legendLabels, datasets: [{ data, backgroundColor: colors, borderWidth: 2, borderColor: '#fff' }] },
                options: {
                    responsive: true, maintainAspectRatio: false, cutout: '60%',
                    plugins: {
                        legend: { position: 'bottom', labels: { usePointStyle: true, padding: 14, font: { size: 11 } } },
                        tooltip: {
                            backgroundColor: 'rgba(30,30,46,0.92)', padding: 10, cornerRadius: 8,
                            callbacks: {
                                label: function(c) {
                                    const origLabel = labels[c.dataIndex];
                                    const val = c.parsed;
                                    const pct = total > 0 ? (val / total * 100).toFixed(1) : '0.0';
                                    if (metric === 'gmv') {
                                        return origLabel + ': ¥' + (val/10000).toFixed(1) + '万 (' + pct + '%)';
                                    } else {
                                        const conv = channels[origLabel].conversions || 0;
                                        const rate = conv > 0 ? (val / conv * 100).toFixed(1) : '0.0';
                                        return origLabel + ': ' + val + '人 (' + pct + '%)  核销率' + rate + '%';
                                    }
                                }
                            }
                        }
                    }
                }
            }));
        }

        // Switch channel doughnut chart metric (GMV占比 ↔ 核销率)
        function switchChannelMetric(scope, channels, metric) {
            const gmvTab = document.getElementById(scope + 'ChGmvTab');
            const verTab = document.getElementById(scope + 'ChVerTab');
            if (metric === 'gmv') {
                gmvTab.style.background = '#4f46e5'; gmvTab.style.color = '#fff'; gmvTab.style.borderColor = '#4f46e5';
                verTab.style.background = '#f0f2f5'; verTab.style.color = '#6b7280'; verTab.style.borderColor = '#e0e3eb';
            } else {
                verTab.style.background = '#16a34a'; verTab.style.color = '#fff'; verTab.style.borderColor = '#16a34a';
                gmvTab.style.background = '#f0f2f5'; gmvTab.style.color = '#6b7280'; gmvTab.style.borderColor = '#e0e3eb';
            }
            const existing = charts.find(c => c.canvas && c.canvas.id === 'channelChart');
            if (existing) { existing.destroy(); charts = charts.filter(c => c !== existing); }
            renderChannelChart('channelChart', channels, metric);
        }

        // Horizontal bar chart (clickable)
        function renderBarChart(canvasId, labels, values, labelText, colors, onClick) {

            const maxLabelLen = Math.max(...labels.map(l => l.length));

                    layout: { padding: { left: 4, right: 10 } },
                    plugins: { legend: { display: false }, tooltip: { backgroundColor: 'rgba(30,30,46,0.92)', padding: 10, cornerRadius: 8 } },
                    scales: {
                        x: { grid: { color: '#f0f2f5' } },
                        y: {
                            grid: { display: false },
                            ticks: { autoSkip: false, font: { size: 10 } },

        function renderChannelCompareChart(canvasId, channels) {
