                    <td>${esc(s.city)}</td>
                    <td style="font-weight:600;color:${(s.metrics.verify_rate_cum || 0) >= 50 ? '#16a34a' : '#d97706'}">${(s.metrics.verify_rate_cum || 0).toFixed(1)}%</td>
                    <td>${(s.metrics.verify_rate_m1 || 0).toFixed(1)}%</td>
                    <td>${(s.metrics.douyin_verify_rate_cum || 0).toFixed(1)}%</td>
                    <td>${(s.metrics.meituan_verify_rate_cum || 0).toFixed(1)}%</td>
                </tr>`;

            const pct = v => gtvTotal > 0 ? (v / gtvTotal * 100).toFixed(1) + '%' : '—';

            el.innerHTML = `
                <div class="summary-chips">
                    <div class="summary-chip">累计核销率<b>${wCum.toFixed(1)}%</b></div>
                    <div class="summary-chip">次月+7天核销率<b>${wM1.toFixed(1)}%</b></div>
                    <div class="summary-chip">抖音GTV<b>${fmtMoney(gtvDouyin)}</b></div>
                    <div class="summary-chip">美团GTV<b>${fmtMoney(gtvMeituan)}</b></div>
                    <div class="summary-chip">小程序GTV<b>${fmtMoney(gtvMini)}</b></div>
                </div>
                <div class="alert-sec-head" style="margin:4px 0 8px">🔻 累计核销率最低门店（真实核销进度落后）</div>
                <table>
                    <thead><tr><th>门店</th><th>城市</th><th>累计至今</th><th>次月+7天</th><th>抖音累计</th><th>美团累计</th></tr></thead>
                    <tbody>${lowCum.map(cumRow).join('')}</tbody>
                </table>
                <div class="chart-hint" style="text-align:left">「累计至今 / 次月+7天」是标准对标窗口口径，让不同月份之间核销率可比；分渠道 GTV 构成：抖音 ${pct(gtvDouyin)} / 美团 ${pct(gtvMeituan)} / 小程序 ${pct(gtvMini)}。</div>
            `;
        }

        function renderStarScorePanel(stores) {
            const el = document.getElementById('starScorePanelBody');
            if (!el) return;

            // Only stores with a meaningful score/star are counted.
            const withStar = stores.filter(s => (s.star_level || 0) > 0);
            const withScore = stores.filter(s => (s.operation_score || 0) > 0);
            if (withStar.length === 0 && withScore.length === 0) {
                el.innerHTML = '<div class="chart-hint">暂无星级 / 经营分数据（数据源未提供或尚未接入）</div>';
                return;
            }

            // Star distribution（按 0.1 精度展示，保留 4.1 分这类小数星级）
            const starDist = {};
            withStar.forEach(s => {
                const k = (s.star_level || 0).toFixed(1);
                starDist[k] = (starDist[k] || 0) + 1;
            });
            const starLabels = Object.keys(starDist).sort((a, b) => parseFloat(a) - parseFloat(b));

            // Low-star stores (star < 4.5) sorted by operation score ascending.
            const lowStar = withStar.filter(s => (s.star_level || 0) < 4.5)
                .sort((a, b) => (a.operation_score || 0) - (b.operation_score || 0));

            // Lowest operation-score stores.
            const lowScore = withScore.slice().sort((a, b) => (a.operation_score || 0) - (b.operation_score || 0)).slice(0, 10);

            const starRow = s => `
                <tr onclick="drillToStoreById('${jsStr(s.id)}')">
                    <td style="font-weight:600">${esc(shortStoreName(s.name))}</td>
                    <td>${esc(s.city)}</td>
                    <td style="font-weight:600;color:#d97706">${(s.star_level || 0).toFixed(1)} <span style="font-size:12px;color:#f59e0b">${'★'.repeat(Math.floor(s.star_level || 0))}${(s.star_level % 1) >= 0.5 ? '☆' : ''}</span></td>
                    <td style="font-weight:600;color:${(s.operation_score || 0) >= 80 ? '#16a34a' : (s.operation_score || 0) >= 60 ? '#d97706' : '#dc2626'}">${s.operation_score || 0}</td>
                </tr>`;

            el.innerHTML = `
                <div class="summary-chips">
                    <div class="summary-chip">有星级门店<b>${withStar.length} / ${stores.length}</b></div>
                    <div class="summary-chip warn">低星门店（&lt;4.5分）<b>${lowStar.length}</b></div>
                    <div class="summary-chip">平均经营分<b>${withScore.length ? (withScore.reduce((a, s) => a + (s.operation_score || 0), 0) / withScore.length).toFixed(1) : '—'}</b></div>
                </div>
                <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px">
                    <div>
                        <div style="height:220px"><canvas id="starDistChart"></canvas></div>
                        <div class="chart-hint">门店星级分布（精确到 0.1 分）</div>
                    </div>
                    <div>
                        <table>
                            <thead><tr><th>门店</th><th>城市</th><th>星级</th><th>经营分</th></tr></thead>
                            <tbody>${(lowStar.length ? lowStar : lowScore).slice(0, 10).map(starRow).join('')}</tbody>
                        </table>
                        <div class="chart-hint">👆 低星 / 低分门店 · 经营分 &lt;60 需重点关注平台流量权重</div>
                    </div>
                </div>
            `;

            const canvas = document.getElementById('starDistChart');
            if (!canvas) return;
            charts.push(new Chart(canvas, {
                type: 'bar',
                data: {
                    labels: starLabels.map(l => l + ' 分'),
                    datasets: [{
                        label: '门店数',
                        data: starLabels.map(l => starDist[l] || 0),
                        backgroundColor: '#d97706',
                        borderRadius: 6,
                    }]
                },
                options: {
                    responsive: true, maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: { x: { grid: { display: false } }, y: { grid: { color: '#f0f2f5' }, ticks: { stepSize: 1 } } }
                }
            }));
        }
        function percentile(sorted, p) {
            if (!sorted || sorted.length === 0) return 0;
            const idx = (sorted.length - 1) * p;
            const lo = Math.floor(idx), hi = Math.ceil(idx);
            if (lo === hi) return sorted[lo];
            return sorted[lo] + (sorted[hi] - sorted[lo]) * (idx - lo);
        }

        function computeFunnelTotals(stores) {
            const t = { visitors: 0, conversions: 0, verified: 0, new_customers: 0, gmv: 0, gtv: 0,
                        refundW: 0, refundGmvW: 0, visMomW: 0, saturation: 0, efficiency: 0, queueUsers: 0,
                        successW: 0, uptick: 0, repurchase: 0, n: 0, chVisitors: {}, chConversions: {} };
            stores.forEach(s => {
                const m = s.metrics;
                t.visitors += m.visitors || 0;
                t.verified += m.verified || 0;
                t.new_customers += m.new_customers || 0;
                t.gmv += m.gmv || 0;
                t.gtv += m.gtv || 0;
                t.saturation += m.saturation || 0;
                t.efficiency += m.efficiency || 0;
                t.uptick += m.uptick_rate || 0;
                t.repurchase += m.repurchase || 0;
                t.queueUsers += m.queue_users || 0;
                t.successW += (m.queue_users || 0) * (m.success_queue_rate || 0);
                t.visMomW += (m.visitors || 0) * (m.visitors_mom || 0);
                t.n++;
                Object.entries(s.channels || {}).forEach(([name, c]) => {
                    t.conversions += c.conversions || 0;
                    t.refundW += (c.gmv || 0) * (c.refund_rate || 0);
                    t.refundGmvW += c.gmv || 0;
                    t.chVisitors[name] = (t.chVisitors[name] || 0) + (c.visitors || 0);
                    t.chConversions[name] = (t.chConversions[name] || 0) + (c.conversions || 0);
                });
            });
            t.conversion_rate = t.visitors > 0 ? t.conversions / t.visitors * 100 : 0;
            t.verify_rate = t.conversions > 0 ? t.verified / t.conversions * 100 : 0;
            t.old_customers = t.verified - t.new_customers;
            t.old_ratio = t.verified > 0 ? Math.max(t.old_customers, 0) / t.verified * 100 : 0;
            t.new_ratio = 100 - t.old_ratio;
            t.refund_rate = t.refundGmvW > 0 ? t.refundW / t.refundGmvW : 0;
            t.visitors_mom = t.visitors > 0 ? t.visMomW / t.visitors : 0;
            t.avg_saturation = t.n ? t.saturation / t.n : 0;
            t.avg_efficiency = t.n ? t.efficiency / t.n : 0;
            t.avg_uptick = t.n ? t.uptick / t.n : 0;
            t.avg_repurchase = t.n ? t.repurchase / t.n : 0;
            t.queue_success = t.queueUsers > 0 ? t.successW / t.queueUsers : 0;
            t.aov = t.verified > 0 ? t.gtv / t.verified : 0;
            return t;
        }

        function chShareStr(chMap, total) {
            return Object.entries(chMap).sort((a, b) => b[1] - a[1]).map(([name, v]) =>
                name + ' ' + (total > 0 ? (v / total * 100).toFixed(0) : 0) + '%'
            ).join(' · ');
        }

        // 【已下线 2026-09-17】「📈 转化分析」主题组已删除（用户要求），对应容器 #funnelPanelBody 不存在，
        // 此函数保留备用（调用已移除），如需恢复请连同主题组 HTML 一起加回。
        function renderFunnelPanel(stores) {
            const el = document.getElementById('funnelPanelBody');
            if (!el) return;
            const t = computeFunnelTotals(stores);
            if (t.visitors === 0) { el.innerHTML = '<div class="chart-hint">无数据</div>'; return; }
            const wConv = Math.max(t.conversions / t.visitors * 100, 35);
            const wVer = Math.max(t.verified / t.visitors * 100, 38);

            const stages = [
                { label: '曝光 · 线上访问', value: fmtNum(t.visitors), sub: chShareStr(t.chVisitors, t.visitors), width: 100, bg: 'linear-gradient(90deg,#6366f1,#818cf8)' },
                { label: '转化 · 线上成交', value: fmtNum(t.conversions), sub: chShareStr(t.chConversions, t.conversions), width: wConv, bg: 'linear-gradient(90deg,#4f46e5,#7c6ee6)' },
                { label: '核销 · 到店消费', value: fmtNum(t.verified), sub: 'GTV ' + fmtMoney(t.gtv) + ' · 人均 ¥' + Math.round(t.aov), width: wVer, bg: 'linear-gradient(90deg,#16a34a,#22b573)' },
            ];
            const rates = [
                { name: '进店转化率', v: t.conversion_rate },
                { name: '到店核销率', v: t.verify_rate },
            ];

            el.innerHTML = `
                <div class="funnel-wrap">
                    <div>
                        ${stages.map((s, i) => `
                            ${i > 0 ? `<div class="funnel-rate"><span class="arrow">↓</span>${rates[i-1].name} <b>${fmtPct(rates[i-1].v)}</b><span class="arrow">↓</span></div>` : ''}
                            <div class="funnel-stage" style="width:${s.width}%;background:${s.bg}">
                                <div class="fs-label">${s.label}</div>
                                <div class="fs-value">${s.value}</div>
                                <div class="fs-sub">${s.sub}</div>
                            </div>
                        `).join('')}
                        <div class="funnel-rate"><span class="arrow">↓</span>核销客构成（复购视角）<span class="arrow">↓</span></div>
                        <div style="max-width:100%;margin:0 auto">
                            <div style="display:flex;height:34px;border-radius:8px;overflow:hidden;font-size:11.5px;color:#fff;text-align:center">
                                <div style="width:${t.old_ratio}%;background:#0891b2;display:flex;align-items:center;justify-content:center;min-width:60px">老客 ${fmtNum(t.old_customers)}（${t.old_ratio.toFixed(1)}%）</div>
                                <div style="width:${t.new_ratio}%;background:#67e8f9;color:#0e4a5a;display:flex;align-items:center;justify-content:center;min-width:60px">新客 ${fmtNum(t.new_customers)}（${t.new_ratio.toFixed(1)}%）</div>
                            </div>
                        </div>
                        <div class="chart-hint">曝光层用线上访问人数近似；成交人数为三渠道加总</div>
                    </div>
                    <div class="stage-cards" style="grid-template-columns:1fr;margin-top:0">
                        <div class="stage-card">
                            <div class="sc-head">👁️ 曝光</div>
                            <div class="sc-row"><span>线上访问</span><b>${fmtNum(t.visitors)}</b></div>
                            <div class="sc-row"><span>访问环比</span><b class="${t.visitors_mom >= 0 ? 'good' : 'bad'}">${fmtPctSigned(t.visitors_mom)}</b></div>
                            <div class="sc-row"><span>渠道结构</span><b>${chShareStr(t.chVisitors, t.visitors)}</b></div>
                        </div>
                        <div class="stage-card">

        function renderCityFunnelTable(src, allStores) {
            const el = document.getElementById('cityFunnelBody');
            if (!el) return;
            const nat = computeFunnelTotals(allStores);
            const rows = Object.entries(src.cities || {}).map(([name, c]) => {
                const cityStores = [];
                Object.values(c.districts || {}).forEach(d => (d.stores || []).forEach(s => cityStores.push(s)));
                return [name, computeFunnelTotals(cityStores)];
            }).sort((a, b) => b[1].visitors - a[1].visitors);

            const diag = t => {
                const tags = [];
                const checks = [
                    { cond: t.conversion_rate < nat.conversion_rate * 0.7, mid: t.conversion_rate < nat.conversion_rate * 0.85, tag: '转化弱' },
                    { cond: t.verify_rate < nat.verify_rate * 0.7, mid: t.verify_rate < nat.verify_rate * 0.85, tag: '履约弱' },
                    { cond: t.repurchase > 0 ? t.avg_repurchase < nat.avg_repurchase * 0.7 : false, mid: t.repurchase > 0 ? t.avg_repurchase < nat.avg_repurchase * 0.85 : false, tag: '留存弱' },
                ];
                checks.forEach(c => {
                    if (c.cond) tags.push('<span class="diag-tag diag-bad">' + c.tag + '</span>');
                    else if (c.mid) tags.push('<span class="diag-tag diag-mid">' + c.tag + '</span>');
                });
                return tags.join('') || '<span class="diag-tag diag-good">健康</span>';
            };

            el.innerHTML = `
                <table>
                    <thead><tr><th>城市</th><th>访问</th><th>成交</th><th>转化率</th><th>核销</th><th>核销率</th><th>老客占比</th><th>复购率</th><th>薄弱环节</th></tr></thead>

                                <td style="color:${t.verify_rate < nat.verify_rate * 0.85 ? '#dc2626' : '#374151'};font-weight:${t.verify_rate < nat.verify_rate * 0.85 ? 600 : 400}">${fmtPct(t.verify_rate)}</td>
                                <td>${t.old_ratio.toFixed(1)}%</td>
                                <td>${fmtPct(t.avg_repurchase)}</td>
                                <td>${diag(t)}</td>
                            </tr>
                        `).join('')}

            `;
        }

        function renderStoreDiagnosis(stores) {
            const el = document.getElementById('storeDiagBody');
            if (!el) return;
            if (stores.length < 8) { el.innerHTML = '<div class="chart-hint">门店数过少，不做分位诊断</div>'; return; }

            const convArr = stores.map(s => s.metrics.conversion_rate).sort((a, b) => a - b);
            const verArr = stores.map(s => s.metrics.verify_rate).sort((a, b) => a - b);
            const repArr = stores.map(s => s.metrics.repurchase).sort((a, b) => a - b);
            const refundArr = stores.map(s => s.metrics.refund_rate).sort((a, b) => a - b);
            const visArr = stores.map(s => s.metrics.visitors).sort((a, b) => a - b);
            const verifArr = stores.map(s => s.metrics.verified).sort((a, b) => a - b);

            const P25c = percentile(convArr, 0.25), P60c = percentile(convArr, 0.60);
            const P25v = percentile(verArr, 0.25), P60v = percentile(verArr, 0.60);
            const P25r = percentile(repArr, 0.25), P60r = percentile(repArr, 0.60);
            const P75rf = percentile(refundArr, 0.75);
            const medVis = percentile(visArr, 0.5), medVerif = percentile(verifArr, 0.5);

            const results = [];
            let benchmarkCount = 0;
            stores.forEach(s => {
                const m = s.metrics;
                const probs = [];
                if (m.visitors >= medVis && m.conversion_rate < P25c) probs.push({ tag: '转化弱', cls: 'diag-bad', why: '有流量没转化' });
                if (m.verify_rate < P25v || m.refund_rate > P75rf) probs.push({ tag: '履约弱', cls: 'diag-bad', why: m.refund_rate > P75rf ? '退款率偏高' : '成交后核销低' });
                if (m.verified >= medVerif && m.repurchase < P25r) probs.push({ tag: '留存弱', cls: 'diag-mid', why: '有客源不复购' });
                if (probs.length === 0 && m.conversion_rate >= P60c && m.verify_rate >= P60v && m.repurchase >= P60r) {
                    benchmarkCount++;
                    results.push({ store: s, probs: [{ tag: '标杆店', cls: 'diag-good', why: '三率均进前40%' }], benchmark: true });
                } else if (probs.length > 0) {
                    results.push({ store: s, probs, benchmark: false });
                }
            });
            const problemStores = results.filter(r => !r.benchmark).sort((a, b) => b.probs.length - a.probs.length);
            const counts = {};
            problemStores.forEach(r => r.probs.forEach(p => { counts[p.tag] = (counts[p.tag] || 0) + 1; }));
            const shown = problemStores.slice(0, 20);

            el.innerHTML = `
                <div class="summary-chips">
                    <div class="summary-chip danger">掉量门店<b>${problemStores.length} / ${stores.length}</b></div>
                    <div class="summary-chip">转化弱<b>${counts['转化弱'] || 0}家</b></div>
                    <div class="summary-chip danger">履约弱<b>${counts['履约弱'] || 0}家</b></div>
                    <div class="summary-chip warn">留存弱<b>${counts['留存弱'] || 0}家</b></div>
                    <div class="summary-chip good">标杆店<b>${benchmarkCount}家</b></div>
                </div>
                <table>
                    <thead><tr><th>#</th><th>门店</th><th>城市</th><th>诊断</th><th>转化率</th><th>核销率</th><th>复购率</th><th>退款率</th></tr></thead>
                    <tbody>
                        ${shown.map((r, i) => `
                            <tr onclick="drillToStoreById('${jsStr(r.store.id)}')">
                                <td><span class="rank-badge rank-other">${i+1}</span></td>
                                <td style="font-weight:600">${esc(shortStoreName(r.store.name))}</td>
                                <td>${r.store.city}</td>
                                <td>${r.probs.map(p => '<span class="diag-tag ' + p.cls + '" title="' + p.why + '">' + p.tag + '</span>').join('')}</td>
                                <td style="color:${r.store.metrics.conversion_rate < P25c ? '#dc2626' : '#374151'}">${fmtPct(r.store.metrics.conversion_rate)}</td>
                                <td style="color:${r.store.metrics.verify_rate < P25v ? '#dc2626' : '#374151'}">${fmtPct(r.store.metrics.verify_rate)}</td>
                                <td style="color:${r.store.metrics.repurchase < P25r ? '#dc2626' : '#374151'}">${fmtPct(r.store.metrics.repurchase)}</td>
                                <td style="color:${r.store.metrics.refund_rate > P75rf ? '#dc2626' : '#374151'}">${fmtPct(r.store.metrics.refund_rate)}</td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
                <div class="chart-hint">分位基准：转化率P25=${fmtPct(P25c)} · 核销率P25=${fmtPct(P25v)} · 复购率P25=${fmtPct(P25r)} · 退款率P75=${fmtPct(P75rf)}。转化弱=流量高于中位但转化率进后25%；标杆店=三率均进前40%。👆 点击行进入门店详情${problemStores.length > 20 ? ' · 仅显示前20家' : ''}</div>
            `;
        }

        // Generic bar chart renderer + switcher for each level
        function renderLevelBarChart(items, metric, getVal, getLabel, onClick) {
            const sorted = [...items].sort((a, b) => getVal(b) - getVal(a));

            const existing = charts.find(c => c.canvas && c.canvas.id === 'barChart');
            if (existing) { existing.destroy(); charts = charts.filter(c => c !== existing); }
            renderBarChart('barChart',
                sorted.map(getLabel),
                values,
                labelText,
                sorted.map((item, i) => COLORS[i % COLORS.length]),
                idx => onClick(sorted[idx], idx)
            );
        }

            let html = '<tr><th>排名</th>';
            visibleColumns.forEach(key => {
                const cfg = colConfig(key);
                if (!cfg) return;
                const arrow = key === tableSortCol ? (tableSortDir === 'asc' ? ' ↑' : ' ↓') : '';
                const color = key === tableSortCol ? 'color:#4f46e5' : '';
                html += '<th class="sortable" style="' + color + '" onclick="sortStoreTable(\'' + key + '\')">' + cfg.label + arrow + '</th>';
            });
            html += '</tr>';
            head.innerHTML = html;
        }

        function renderStoreTableBody() {
            let list = _level2Stores.slice();
            if (storeTypeFilter !== 'all') list = list.filter(st => st.store_type === storeTypeFilter);
            list.sort((a, b) => {
                const av = colValue(a, tableSortCol);
                const bv = colValue(b, tableSortCol);
                if (typeof av === 'string') return tableSortDir === 'asc' ? av.localeCompare(bv) : bv.localeCompare(av);
                return tableSortDir === 'asc' ? av - bv : bv - av;
            });
            const body = document.getElementById('storeTableBody');
            if (!body) return;
            body.innerHTML = list.map((st, i) => {
                let html = '<tr onclick="drillToStoreById(\'' + jsStr(st.id) + '\')">' +
                    '<td><span class="rank-badge ' + (i<3?'rank-'+(i+1):'rank-other') + '">' + (i+1) + '</span></td>';
                visibleColumns.forEach(key => {
                    const cfg = colConfig(key);
                    if (!cfg) return;
                    const val = colValue(st, key);
                    const style = key === 'name' ? ' style="font-weight:600"' :
                                  key === 'gmv' ? ' style="font-weight:600;color:#4f46e5"' : '';
                    const cell = key === 'name' ? esc(cfg.fmt(val)) : cfg.fmt(val);
                    html += '<td' + style + '>' + cell + '</td>';
                });
                html += '</tr>';
                return html;
            }).join('');
        }

        function sortStoreTable(col) {
            if (tableSortCol === col) {
                tableSortDir = tableSortDir === 'asc' ? 'desc' : 'asc';
            } else {
                tableSortCol = col;
                tableSortDir = 'desc';
            }
            renderStoreTableHead();
            renderStoreTableBody();
        }

        // ===== Column settings panel =====

        function buildColSettingsPanel() {
            const panel = document.getElementById('colSettingsPanel');
            if (!panel) return;
            panel.innerHTML = TABLE_COLUMNS.map(c => {
                const checked = visibleColumns.includes(c.key) ? ' checked' : '';
                return '<label><input type="checkbox" value="' + c.key + '"' + checked + ' onchange="toggleColumn(\'' + c.key + '\')">' + c.label + '</label>';
            }).join('');
        }

        function toggleColumn(key) {
            const idx = visibleColumns.indexOf(key);
            if (idx >= 0) {
                if (visibleColumns.length <= 1) return; // keep at least 1 column
                visibleColumns.splice(idx, 1);
            } else {
                visibleColumns.push(key);
            }
            // If sort column was removed, switch to first visible
            if (!visibleColumns.includes(tableSortCol) && visibleColumns.length > 0) {
                tableSortCol = visibleColumns[0];
                tableSortDir = 'desc';
            }
            renderStoreTableHead();
            renderStoreTableBody();
        }

        function toggleColSettings() {
            const panel = document.getElementById('colSettingsPanel');
            if (panel) panel.classList.toggle('show');
        }

        // ===== Level 3: Store Detail =====
        function renderLevel3(container) {
            const src = getCurrentData();
            const cityData = src.cities[currentPath.city];
            if (!cityData) { container.innerHTML = '<div class="loading">无数据</div>'; return; }
            const distData = cityData.districts[currentPath.district];
            if (!distData) { container.innerHTML = '<div class="loading">无数据</div>'; return; }
            const store = hydrateStore(distData.stores.find(s => s.id === currentPath.storeId));
            if (!store) { container.innerHTML = '<div class="loading">门店未找到</div>'; return; }

            const m = store.metrics;
            const ch = store.channels || {};
            const chKeys = Object.keys(ch);

            container.innerHTML = `
                <!-- Store info -->
                <div class="store-detail-card">
                    <h3>🏢 ${store.name}</h3>
                    <div class="store-info-grid">
                        <div class="store-info-item"><div class="si-label">代理商</div><div class="si-value">${store.agent || '—'}</div></div>
                        <div class="store-info-item"><div class="si-label">开业日期</div><div class="si-value">${store.open_date || '—'}</div></div>
                        <div class="store-info-item"><div class="si-label">开业天数</div><div class="si-value">${store.open_days}天</div></div>
                        <div class="store-info-item"><div class="si-label">门店类型</div><div class="si-value"><span class="store-type-badge ${store.store_type==='老店'?'store-type-old':'store-type-new'}">${store.store_type}</span></div></div>
                        <div class="store-info-item"><div class="si-label">所在城市</div><div class="si-value">${store.city}</div></div>
                        <div class="store-info-item"><div class="si-label">所在区域</div><div class="si-value">${store.district}</div></div>
                    </div>
                </div>

                <!-- Metrics -->
                <div class="metrics-grid">${renderMetricCards(m)}</div>

                <!-- Charts -->
                <div class="charts-row">
                    <div class="chart-card">
                        <h3><span>渠道GMV对比</span><span class="tag">美团/抖音/小程序</span></h3>
                        <div class="chart-container"><canvas id="channelCompareChart"></canvas></div>
                    </div>
                    <div class="chart-card">
                        <h3><span>运营指标雷达</span><span class="tag">门店级</span></h3>
                        <div class="chart-container"><canvas id="radarChart"></canvas></div>
                    </div>
                </div>

                <!-- Channel detail table -->
                <div class="table-card">
                    <h3>📋 渠道明细</h3>
                    <table>
                        <thead><tr><th>渠道</th><th>访问人数</th><th>成交人数</th><th>转化率</th><th>GMV</th><th>GTV</th><th>客单价</th><th>退款率</th><th>核销率</th><th>折扣率</th></tr></thead>
                        <tbody>
                            ${chKeys.map(cn => {
                                const c = ch[cn];
                                return `<tr style="cursor:default">
                                    <td style="font-weight:600">${cn}</td>
                                    <td>${fmtNum(c.visitors)}</td>
                                    <td>${fmtNum(c.conversions)}</td>
                                    <td>${fmtPct(c.conversion_rate)}</td>
                                    <td style="font-weight:600;color:#4f46e5">${fmtMoney(c.gmv)}</td>
                                    <td>${fmtMoney(c.gtv)}</td>
                                    <td>¥${c.aov}</td>
                                    <td>${fmtPct(c.refund_rate)}</td>
                                    <td>${fmtPct(c.verify_rate)}</td>
                                    <td>${fmtPct(c.discount)}</td>
                                </tr>`;
                            }).join('')}
                        </tbody>
                    </table>
                </div>

                <!-- Extended metrics -->
                <div class="table-card">
                    <h3>📊 门店运营指标</h3>
                    <table>
                        <thead><tr><th>指标</th><th>数值</th><th>指标</th><th>数值</th><th>指标</th><th>数值</th></tr></thead>
                        <tbody>
                            <tr style="cursor:default">
                                <td>日均美甲师数量</td><td>${m.manicurist_count}</td>
                                <td>门店日均服务次数</td><td>${m.daily_service_count}</td>
                                <td>门店日均服务人数</td><td>${m.daily_service_users}</td>
                            </tr>
                            <tr style="cursor:default">
                                <td>美甲师日均人效</td><td>¥${m.efficiency}</td>
                                <td>升单率</td><td>${fmtPct(m.uptick_rate)}</td>
                                <td>工位饱和率</td><td>${fmtPct(m.saturation)}</td>
                            </tr>
                            <tr style="cursor:default">
                                <td>评价数</td><td>${fmtNum(m.reviews)}</td>
                                <td>好评数</td><td>${fmtNum(m.good_reviews)}</td>
                                <td>差评数</td><td>${fmtNum(m.bad_reviews)}</td>
                            </tr>
                            <tr style="cursor:default">
                                <td>原价核销金额</td><td>${fmtMoney(m.original_amount)}</td>
                                <td>退款率</td><td>${fmtPct(m.refund_rate)}</td>
                                <td>订单核销率</td><td>${fmtPct(m.verify_rate)}</td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <!-- Store diagnosis（渠道归因 + 预警 + 漏斗 + 渠道质量） -->
                <div id="storeBizAnalysis"></div>
            `;

            // Render charts
            if (chKeys.length > 0) {
                renderChannelCompareChart('channelCompareChart', ch);
            }
            renderRadarChart('radarChart', m);
            renderStoreBusinessAnalysis(store);
        }

        // ===== Navigation =====
        function drillToCity(cityName) {
            currentLevel = 1;
            currentPath = { city: cityName, district: null, storeId: null };
            renderAll();
        }

        function drillToDistrict(districtName) {
            currentLevel = 2;
            currentPath.district = districtName;
            currentPath.storeId = null;
            renderAll();
        }

        function drillToStore(storeId) {
            currentLevel = 3;
            currentPath.storeId = storeId;
            renderAll();
        }

        function navigateTo(level) {
            currentLevel = level;
            if (level <= 2) currentPath.storeId = null;
            if (level <= 1) currentPath.district = null;
            if (level === 0) currentPath.city = null;
            renderAll();
        }

        // Chart.js defaults
        Chart.defaults.font.family = "-apple-system, 'PingFang SC', sans-serif";
        Chart.defaults.font.size = 11;
        Chart.defaults.color = '#6b7280';

        // ===== 逐日趋势柱状图悬浮提示（鼠标悬停即时显示数值）=====
        (function () {
            const tip = document.createElement('div');
            tip.className = 'tr-tip';
            document.body.appendChild(tip);
            document.addEventListener('mouseover', function (e) {
                const col = e.target && e.target.closest ? e.target.closest('.tr-col') : null;
                if (col && col.getAttribute('data-tip')) {
                    tip.textContent = col.getAttribute('data-tip');
                    const r = col.getBoundingClientRect();
                    tip.style.left = (r.left + r.width / 2) + 'px';
                    tip.style.top = r.top + 'px';
                    tip.classList.add('show');
                } else {
                    tip.classList.remove('show');
                }
            });
        })();

        // Initial render — placed last so every const/function above is ready.
        (function bootPeriodRouting() {
            const sel = document.getElementById('monthSel');
            if (sel) sel.addEventListener('change', onMonthSelChange);
            window.addEventListener('hashchange', applyHash);
            applyHash(); // 会 applyPeriod → renderAll
        })();
    </script>
</body>
</html>
